# Construit le paquet Synology (.spk) sous Linux : le build exige des droits d'execution
# sur le JRE embarque (bin/java), impossibles a poser depuis un poste Windows.
# Lancement : a la main (onglet Actions, "Run workflow", en indiquant le tag d'image deja publie)
# ou automatiquement sur un tag v*. Le .spk est disponible en "artifact" de l'execution.
name: Construire le paquet NAS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de l'image applicative a embarquer (deja publiee sur GHCR)"
        required: true
        default: v1.1
      arch:
        description: "Cible : armv8 = NAS Synology, x86_64 = serveur Linux (VPS)"
        type: choice
        options: [armv8, x86_64]
        default: armv8
      domaine:
        description: "VPS (x86_64) uniquement : nom de domaine public de l'application (affiche dans la commande)"
        required: false
        default: app.logicielpourtous.com
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Agent (jar)
        run: mvn -B -f agent/pom.xml -DskipTests package

      - name: JRE epingle (SHA-256 verifiee)
        env:
          ARCH: ${{ inputs.arch || 'armv8' }}
        run: bash nas-package/spk/fetch-jre.sh "$ARCH" "$RUNNER_TEMP/jre"

      - name: Paquet .spk
        env:
          SPK_ARCH: ${{ inputs.arch || 'armv8' }}
          HEADSCALE_URL: https://headscale.logicielpourtous.com
          IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          export IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export JRE_DIR="$RUNNER_TEMP/jre"
          export AGENT_JAR="$(ls agent/target/agent-*.jar | grep -v original | head -n 1)"
          bash nas-package/spk/build-spk.sh
          ls -la nas-package/spk/dist

      # Livrable : le .spk et les scripts d'installation par SSH (DSM 7 refuse d'installer ce
      # .spk par le Centre de paquets : il demande les droits root).
      - name: Assembler le livrable
        env:
          ARCH: ${{ inputs.arch || 'armv8' }}
          DOMAINE: ${{ inputs.domaine || 'app.logicielpourtous.com' }}
        run: |
          mkdir -p livrable
          cp nas-package/spk/dist/*.spk livrable/
          cp nas-package/installer/installer-nas.sh nas-package/installer/desinstaller-nas.sh livrable/
          ls -la livrable
          # Somme SHA-256 a fournir a l'installateur : elle est affichee ICI (journal et resume de
          # l'execution GitHub), un canal different du fichier telecharge, qui ne permet pas a
          # celui qui alterer le .spk de modifier aussi la somme attendue.
          SPK_FICHIER="$(basename livrable/*.spk)"
          SPK_SOMME="$(sha256sum livrable/*.spk | cut -d' ' -f1)"
          INSTALLATEUR_SOMME="$(sha256sum livrable/installer-nas.sh | cut -d' ' -f1)"
          {
            echo "### Livrable du paquet NAS"
            echo
            echo "Construit depuis le commit \`$GITHUB_SHA\` (ref : \`$GITHUB_REF\`). Verifiez que ce commit est bien celui que vous attendez."
            echo
            echo "Commande d'installation (sur le NAS, en SSH, dans le dossier ou vous avez copie les fichiers) : l'installateur est verifie AVANT d'etre execute, puis il verifie le .spk."
            echo '```'
            # L'installateur est copie dans un dossier prive de root, verifie, puis ce sont ces memes octets
            # qui sont executes : un fichier verifie puis relu depuis un dossier modifiable pourrait etre remplace entre les deux.
            if [ "$ARCH" = "x86_64" ]; then
              # Serveur Linux (VPS) : mode vps + domaine public ; l'identifiant/mot de passe du compte de
              # licence partenaire sont demandes au clavier (jamais dans la commande).
              [[ "$DOMAINE" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "domaine invalide" >&2; exit 1; }
              echo "D=\"\$(sudo mktemp -d)\" && sudo cp -- installer-nas.sh \"\$D/i.sh\" && echo \"$INSTALLATEUR_SOMME  \$D/i.sh\" | sudo sha256sum -c - && sudo SITE_NAS_CIBLE=vps SITE_NAS_DOMAINE=$DOMAINE bash \"\$D/i.sh\" $SPK_FICHIER $SPK_SOMME; sudo rm -rf \"\$D\""
            else
              echo "D=\"\$(sudo mktemp -d)\" && sudo cp -- installer-nas.sh \"\$D/i.sh\" && echo \"$INSTALLATEUR_SOMME  \$D/i.sh\" | sudo sha256sum -c - && sudo bash \"\$D/i.sh\" $SPK_FICHIER $SPK_SOMME; sudo rm -rf \"\$D\""
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-nas-${{ inputs.arch || 'armv8' }}
          path: livrable/*
          if-no-files-found: error
