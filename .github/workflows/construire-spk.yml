# Construit le paquet Synology (.spk) sous Linux : le build exige des droits d'execution
# sur le JRE embarque (bin/java), impossibles a poser depuis un poste Windows.
# Lancement : a la main (onglet Actions, "Run workflow", en indiquant le tag d'image deja publie)
# ou automatiquement sur un tag v*. Le .spk est disponible en "artifact" de l'execution.
name: Construire le paquet NAS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de l'image applicative a embarquer (deja publiee sur GHCR)"
        required: true
        default: v1.1
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Agent (jar)
        run: mvn -B -f agent/pom.xml -DskipTests package

      - name: JRE ARM epingle (SHA-256 verifiee)
        run: bash nas-package/spk/fetch-jre.sh armv8 "$RUNNER_TEMP/jre-armv8"

      - name: Paquet .spk (armv8)
        env:
          SPK_ARCH: armv8
          HEADSCALE_URL: https://headscale.logicielpourtous.com
          IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          export IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export JRE_DIR="$RUNNER_TEMP/jre-armv8"
          export AGENT_JAR="$(ls agent/target/agent-*.jar | grep -v original | head -n 1)"
          bash nas-package/spk/build-spk.sh
          ls -la nas-package/spk/dist

      # Livrable : le .spk et les scripts d'installation par SSH (DSM 7 refuse d'installer ce
      # .spk par le Centre de paquets : il demande les droits root).
      - name: Assembler le livrable
        run: |
          mkdir -p livrable
          cp nas-package/spk/dist/*.spk livrable/
          cp nas-package/installer/installer-nas.sh nas-package/installer/desinstaller-nas.sh livrable/
          ls -la livrable
          # Somme SHA-256 a fournir a l'installateur : elle est affichee ICI (journal et resume de
          # l'execution GitHub), un canal different du fichier telecharge, qui ne permet pas a
          # celui qui alterer le .spk de modifier aussi la somme attendue.
          {
            echo "### Sommes SHA-256 du livrable"
            echo
            echo "Commande d'installation (sur le NAS, en SSH) :"
            echo '```'
            echo "sudo bash installer-nas.sh $(basename livrable/*.spk) $(sha256sum livrable/*.spk | cut -d' ' -f1)"
            echo '```'
            echo
            echo "Somme de installer-nas.sh : $(sha256sum livrable/installer-nas.sh | cut -d' ' -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-nas-armv8
          path: livrable/*
          if-no-files-found: error
