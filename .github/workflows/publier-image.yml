# Publie l'image de l'application sur GHCR quand un tag v* est pousse.
# Convention : l'image porte EXACTEMENT le nom du tag git (ghcr.io/<proprietaire>/site:<tag>),
# car l'Agent de deploiement construit la reference d'image a partir du tag tel quel.
name: Publier l'image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Le SDK Ingram Micro est heberge sur GitHub Packages (organisation ingrammicro-xvantage),
          # pas lisible avec le GITHUB_TOKEN automatique : setup-java ecrit settings.xml avec
          # le depot "github-ingram" (meme id que dans pom.xml), identifiants lus dans l'environnement.
          server-id: github-ingram
          server-username: INGRAM_PACKAGES_USER
          server-password: INGRAM_PACKAGES_TOKEN

      # Les vrais fichiers de config sont ignores par git (secrets) : on part des
      # exemples, qui ne contiennent que des placeholders surchargeables par l'environnement.
      - name: Configuration de build depuis les exemples
        run: |
          cp src/main/resources/application.properties.example src/main/resources/application.properties
          cp src/main/resources/application-prod.properties.example src/main/resources/application-prod.properties

      # Tests non lances ici : une vingtaine sont des @SpringBootTest dont les besoins en base
      # ne sont pas encore connus pour l'integration continue. A ajouter dans un workflow
      # dedie des qu'ils sont fiabilises (voir README du paquet NAS).
      - name: Compilation
        env:
          INGRAM_PACKAGES_USER: ${{ github.repository_owner }}
          INGRAM_PACKAGES_TOKEN: ${{ secrets.INGRAM_PACKAGES_TOKEN }}
        # Le projet Angular (frontend/intra) est HORS de ce depot : son resultat compile est deja
        # commite dans src/main/resources/static/app. On saute donc node/npm ; consequence : avant
        # de poser un tag, reconstruire l'interface en local (npm run build) et commiter static/app.
        run: mvn -B -DskipTests -Dskip.installnodenpm=true -Dskip.npm=true package

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/site
          tags: type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
