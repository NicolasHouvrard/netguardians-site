# Exemple de configuration Authelia 4.39+ pour la connexion unique du site.
# Adaptez les valeurs marquees CHANGER_MOI. AUCUN secret ici : mots de passe et cles sont dans /secrets (voir compose).
# Reference officielle : https://www.authelia.com/configuration/ (verifiez les noms de cles pour votre version exacte).
theme: auto

server:
  address: 'tcp://:9091/'

log:
  level: info

# --- Annuaire : LDAP du NAS, joint par le reseau prive uniquement ---------------------------------------
authentication_backend:
  # OPTION (a) RETENUE PAR DEFAUT : la reinitialisation de mot de passe par Authelia est DESACTIVEE. Les mots de passe sont
  # definis par l'administration dans le LDAP, et le compte de service ci-dessous reste en lecture seule.
  # Option (b) : mettre « disable: false » ET donner au compte de service une ecriture LIMITEE a l'attribut userPassword
  # (ACL du LDAP), JAMAIS a « mail » ni aux autres attributs (voir docs/connexion-authelia.md, point 1).
  password_reset:
    disable: true
  ldap:
    implementation: custom
    address: 'ldaps://100.64.0.2:636'      # adresse privee du NAS (reseau Tailscale/Headscale), jamais une adresse publique
    tls:
      skip_verify: false                    # fournissez le certificat de l'autorite si besoin (tls.certificate_chains)
    base_dn: 'dc=CHANGER_MOI,dc=local'      # base DN affichee par le paquet LDAP de Synology
    additional_users_dn: 'cn=users'
    additional_groups_dn: 'cn=groups'
    users_filter: '(&({username_attribute}={input})(objectClass=posixAccount))'   # {username_attribute} = attributes.username ci-dessous
    groups_filter: '(&(|(member={dn})(memberUid={username}))(objectClass=posixGroup))'
    attributes:
      username: 'mail'                       # identifiant de connexion = e-mail (si vous preferez « uid », changez ici ET dans la doc)
      mail: 'mail'                           # l'e-mail de l'annuaire fait foi pour le rattachement au compte du site
      display_name: 'cn'
      group_name: 'cn'
    user: 'uid=authelia,cn=users,dc=CHANGER_MOI,dc=local'   # compte de service dedie, LECTURE SEULE (option a)
    # le mot de passe vient de AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE

# --- Politique d'acces -----------------------------------------------------------------------------------
# Usage OpenID Connect seul : l'acces des clients du site est gouverne par authorization_policies (plus bas), pas par des
# regles access_control (qui servent a proteger des sites derriere Authelia par Nginx). On garde donc « deny » sans regle.
access_control:
  default_policy: deny

session:
  # secret : AUTHELIA_SESSION_SECRET_FILE
  cookies:
    - domain: 'auth.logicielpourtous.com'    # cookie limite au portail ; a verifier avec la documentation d'Authelia de votre version (4.39)
      authelia_url: 'https://auth.logicielpourtous.com'
      default_redirection_url: 'https://master.logicielpourtous.com'
      expiration: '1h'
      inactivity: '15m'
      remember_me: -1                         # « se souvenir de moi » desactive : la deconnexion n'est que locale (voir doc, point 7)

regulation:                                  # limitation des essais
  max_retries: 5
  find_time: '2m'
  ban_time: '10m'

storage:
  # cle : AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  local:
    path: '/config/db.sqlite3'

notifier:
  smtp:
    address: 'submission://CHANGER_MOI.exemple.com:587'
    username: 'CHANGER_MOI'
    # mot de passe : AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE
    sender: 'Authelia <ne-pas-repondre@logicielpourtous.com>'

totp:
  issuer: 'logicielpourtous.com'

# --- Fournisseur OpenID Connect : UN client confidentiel par serveur du site --------------------------------
identity_providers:
  oidc:
    # hmac_secret : AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
    jwks:
      - key_id: 'cle-principale'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc_jwks_rsa.pem" | mindent 10 "|" | msquote }}

    # Le site lit email et email_verified DANS le jeton d'identite : on les y place explicitement.
    claims_policies:
      site:
        id_token: ['email', 'email_verified', 'name', 'preferred_username']

    # Double facteur obligatoire pour les administrateurs, simple facteur pour les autres.
    authorization_policies:
      site:
        default_policy: 'one_factor'
        rules:
          - policy: 'two_factor'
            subject: 'group:administrateurs'      # groupe LDAP des administrateurs (CHANGER_MOI si different)

    clients:
      # --- Le Maitre (NAS) ---
      - client_id: 'site-maitre'
        client_name: 'Site - Maitre'
        client_secret: '$pbkdf2-sha512$CHANGER_MOI_EMPREINTE_DU_SECRET_DU_MAITRE'   # EMPREINTE (hash), jamais le secret en clair
        public: false
        authorization_policy: 'site'
        claims_policy: 'site'
        consent_mode: 'implicit'                  # pas d'ecran de consentement : clients de confiance
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://master.logicielpourtous.com/login/oauth2/code/authelia'
        scopes: ['openid', 'email', 'profile']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'

      # --- Le VPS (serveur secondaire) ---
      - client_id: 'site-vps'
        client_name: 'Site - VPS'
        client_secret: '$pbkdf2-sha512$CHANGER_MOI_EMPREINTE_DU_SECRET_DU_VPS'
        public: false
        authorization_policy: 'site'
        claims_policy: 'site'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://CHANGER_MOI-adresse-publique-du-vps/login/oauth2/code/authelia'
        scopes: ['openid', 'email', 'profile']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'

      # Un bloc identique par serveur supplementaire (client_id, secret et redirect_uris propres a chacun).
