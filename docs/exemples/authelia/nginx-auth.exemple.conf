# Exemple de configuration Nginx du VPS. A adapter (certificats, port du Maitre) puis a placer dans
# /etc/nginx/conf.d/ ; testez avec « nginx -t » avant de recharger.

# --- Portail d'authentification ---------------------------------------------------------------------
server {
    listen 80;
    server_name auth.logicielpourtous.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.logicielpourtous.com;

    ssl_certificate     /etc/letsencrypt/live/auth.logicielpourtous.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.logicielpourtous.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}

# --- Le Maitre, joignable publiquement (connexion unique + redirections d'aiguillage) ----------------------
# Le site construit l'adresse de retour OpenID Connect depuis la requete (server.forward-headers-strategy=native) :
# SANS ces en-tetes, il annoncerait http:// ou le mauvais hote et Authelia refuserait le retour.
# Meme principe pour CHAQUE serveur du site place derriere un Nginx (bloc ci-dessous a dupliquer).
server {
    listen 443 ssl;
    http2 on;
    server_name master.logicielpourtous.com;

    ssl_certificate     /etc/letsencrypt/live/master.logicielpourtous.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/master.logicielpourtous.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;            # aligne sur spring.servlet.multipart.max-request-size

    location / {
        proxy_pass http://100.64.0.2:8080;     # Maitre sur le reseau prive ; remplacez le port par celui de votre installation
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }
}
