<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{socle/layout}">
<body>
<div class="socle-zone" layout:fragment="contenu">
    <div class="alert alert-success" role="alert" th:if="${succes != null}" th:text="${succes}">Succès</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Clients</h1>
        <a class="btn btn-primary" th:href="@{/p/clients/nouveau}">Créer un client</a>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(clients)}">Aucun client pour le moment.</p>
    <table class="table table-hover align-middle" th:unless="${#lists.isEmpty(clients)}">
        <thead>
        <tr><th>Nom</th><th>SIREN</th><th>N° de TVA</th><th>Origine</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clients}">
            <td th:text="${c.nom()}">Société</td>
            <td th:text="${c.siren()}">123456789</td>
            <td th:text="${c.tva()}">FR00123456789</td>
            <td th:text="${c.origine()}">PARTENAIRE</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/p/clients/{id}/fiche(id=${c.societeId()})}">Fiche</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
