<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{socle/layout}">
<body>
<div class="socle-zone" layout:fragment="contenu">
    <div class="alert alert-success" role="alert" th:if="${succes != null}" th:text="${succes}">Succès</div>
    <div class="alert alert-danger" role="alert" th:if="${erreur != null}" th:text="${erreur}">Erreur</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Partenaires</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/p/partenaires/modele}">Modèle de droits</a>
            <a class="btn btn-primary" th:href="@{/p/partenaires/nouveau}">Créer un partenaire</a>
        </div>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(partenaires)}">Aucun partenaire pour le moment.</p>
    <table class="table table-hover align-middle" th:unless="${#lists.isEmpty(partenaires)}">
        <thead>
        <tr><th>Identifiant</th><th>SIREN</th><th>Raison sociale</th><th>État</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${partenaires}">
            <td th:text="${p.societeId()}">1</td>
            <td th:text="${p.siren()}">123456789</td>
            <td th:text="${p.raisonSociale()}">Société</td>
            <td th:text="${p.etat()}">ACTIF</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/p/partenaires/{id}/clients(id=${p.societeId()})}">Clients</a>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/p/partenaires/{id}/clients/nouveau(id=${p.societeId()})}">Créer un client</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
