<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{socle/layout}">
<body>
<div class="socle-zone" layout:fragment="contenu">
    <div class="alert alert-success" role="alert" th:if="${succes != null}" th:text="${succes}">Succès</div>
    <div class="alert alert-danger" role="alert" th:if="${erreur != null}" th:text="${erreur}">Erreur</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Modèle de droits des nouveaux partenaires</h1>
        <a class="btn btn-outline-secondary" th:href="@{/p/partenaires/liste}">Retour à la liste</a>
    </div>
    <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="d : ${droits}">
            <code th:text="${d}">droit</code>
            <form method="post" th:action="@{/p/partenaires/modele/retirer}" class="m-0">
                <input type="hidden" name="droit" th:value="${d}">
                <button type="submit" class="btn btn-sm btn-outline-danger">Retirer</button>
            </form>
        </li>
    </ul>
    <form method="post" th:action="@{/p/partenaires/modele/ajouter}" class="row g-2 col-md-6">
        <div class="col">
            <label class="visually-hidden" for="droit">Droit à ajouter</label>
            <input class="form-control" id="droit" name="droit" maxlength="60" placeholder="clients.exporter">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
    </form>
</div>
</body>
</html>
