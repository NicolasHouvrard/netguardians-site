# Profil de VALIDATION bout-en-bout du module licence (Task 7) : instance "CLIENT" — s'auto-enrole
# auprès du MEME MP que le partenaire (PAS l'adresse du partenaire : c'est le MP qui resout, a partir
# du jeton, a quel CompteLicence/partenaire ce client appartient — voir LicenceBootstrap), avec un
# jeton d'installation A USAGE UNIQUE genere par le PARTENAIRE pour ce client precis (ecran
# /intra/licence/serveurs cote PARTENAIRE, bouton de generation de jeton — Task 4/5).
#
# Une fois enrole, ce CLIENT termine AUSSI, automatiquement, son inscription au moteur de
# synchronisation features.sync auprès du PARTENAIRE (LicenceBootstrap#enrolerSyncSiNecessaire,
# POST /api/sync/enroll deja existant, reutilise tel quel) et stocke la cle API sync obtenue EN BASE
# (EtatLicenceLocale.cleApiSync) — JAMAIS directement dans app.sync.* ("pas de redemarrage
# programmatique", contrainte globale du plan). Pour activer REELLEMENT RestSyncClient/
# SyncOutboxScheduler et faire circuler une vraie Request vers le partenaire, il faut donc un 2nd
# lancement MANUEL de ce meme process, en ajoutant sur la ligne de commande les 2 proprietes
# app.sync.master-url / app.sync.api-key (valeurs obtenues par requete SQL, voir task-7-report.md) :
#
#   java -jar target/site-*.jar --spring.profiles.active=local,licence-client \
#        --app.sync.master-url=http://localhost:8092 --app.sync.api-key=<cle_api_sync lue en base>
#
# A cumuler avec le profil local pour le 1er lancement (enrolement) :
# -Dspring-boot.run.profiles=local,licence-client
#
# Base et port NEUFS, DISTINCTS de application-sync-client.properties (port 8082, base
# site_db_secondaire) — voir application-licence-mp.properties. Ne surcharge que ce qui change par
# rapport a "local".

server.port=8093

spring.datasource.url=jdbc:postgresql://localhost:5432/site_db_licence_client
spring.jpa.defer-datasource-initialization=true

app.role=CLIENT

# Adresse du MP (PAS celle du partenaire — voir l'explication ci-dessus).
app.licence.master-url=http://localhost:8091

# Jeton d'installation a usage unique genere par le PARTENAIRE pour le Customer vise (ecran
# /intra/licence/serveurs de l'instance PARTENAIRE) — a copier ici AVANT de demarrer cette instance.
# JAMAIS app.licence.login/mot-de-passe en meme temps (exactement une des deux methodes).
app.licence.jeton=${LICENCE_JETON:}

app.licence.poll-interval-ms=2000
app.licence.initial-delay-ms=2000

# PAS de app.sync.* ici VOLONTAIREMENT au 1er lancement : tant qu'elles sont absentes,
# RestSyncClient/SyncOutboxScheduler (@ConditionalOnProperty(app.sync.master-url)) ne sont meme pas
# crees, donc aucune boucle d'erreur bruyante pendant la fenetre ou ce CLIENT n'a pas encore sa cle
# API sync (obtenue automatiquement, mais seulement une fois que le PARTENAIRE l'aura decouvert et
# lui aura pousse son code local — voir LicenceDecouverteScheduler). Les ajouter EXISTE seulement au
# 2nd lancement, via la ligne de commande (voir l'en-tete de ce fichier) — jamais codees en dur ici,
# puisque les DEUX valeurs (adresse ET cle) ne sont connues qu'APRES le 1er lancement.

# Captcha Turnstile DESACTIVE pour cette validation locale UNIQUEMENT : application.properties
# l'active par defaut (captcha.enabled=${CAPTCHA_ENABLED:true}), ce qui bloquerait tout POST /login
# scripte (java.net.http.HttpClient, aucun navigateur pour resoudre le challenge) — voir
# EndToEndLicenceTest#sessionClient et task-7-report.md. NE JAMAIS copier cette ligne dans un profil
# de deploiement reel.
captcha.enabled=false
