# Profil de VALIDATION bout-en-bout du module licence (Task 7) : instance "MP" (maitre du mecanisme
# de licence — CompteLicence, LicenceServeur, admin /intra/licence/comptes).
# A cumuler avec le profil local : -Dspring-boot.run.profiles=local,licence-mp
# Ne surcharge que ce qui change par rapport a "local".
#
# Base et port NEUFS, DISTINCTS de ceux de la validation du moteur de synchronisation (plan
# precedent, application-sync-partner/sync-client.properties : ports 8081/8082, bases
# site_db/site_db_secondaire) pour pouvoir lancer les deux validations sans collision — voir le
# scenario de validation documente dans task-7-report.md.

server.port=8091

# Base neuve : Hibernate doit creer le schema AVANT les scripts spring.sql.init (voir application.properties).
spring.datasource.url=jdbc:postgresql://localhost:5432/site_db_licence_mp
spring.jpa.defer-datasource-initialization=true

# MASTER est le role par defaut (voir ServerRoleProperties) : rendu explicite ici pour la lisibilite
# du scenario de validation, sans effet different de l'absence de cette ligne.
app.role=MASTER

# Aucune propriete app.licence.* : un MASTER n'en a besoin d'aucune — LicenceBootstrap, LicenceClient
# et LicenceDecouverteScheduler sont tous @ConditionalOnProperty(app.licence.master-url) et ne sont
# donc meme pas crees sur cette instance (voir leur javadoc de classe).

# Captcha Turnstile DESACTIVE pour cette validation locale UNIQUEMENT : application.properties
# l'active par defaut (captcha.enabled=${CAPTCHA_ENABLED:true}), ce qui bloquerait tout POST /login
# scripte (java.net.http.HttpClient, aucun navigateur pour resoudre le challenge) — voir
# EndToEndLicenceTest#sessionClient et task-7-report.md. NE JAMAIS copier cette ligne dans un profil
# de deploiement reel.
captcha.enabled=false
