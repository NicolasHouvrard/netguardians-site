# Profil de VALIDATION bout-en-bout du module licence (Task 7) : instance "PARTENAIRE" — s'auto-
# enrole au demarrage auprès du MP (LicenceBootstrap, login/mot de passe d'un CompteLicence cree
# manuellement sur /intra/licence/comptes cote MP), puis decouvre et materialise localement ses
# propres clients (LicenceDecouverteScheduler) et peut leur generer un jeton d'installation depuis
# /intra/licence/serveurs.
# A cumuler avec le profil local : -Dspring-boot.run.profiles=local,licence-partenaire
#
# Base et port NEUFS, DISTINCTS de application-sync-partner.properties (port 8081, base site_db) —
# voir application-licence-mp.properties. Ne surcharge que ce qui change par rapport a "local".

server.port=8092

spring.datasource.url=jdbc:postgresql://localhost:5432/site_db_licence_partenaire
spring.jpa.defer-datasource-initialization=true

app.role=PARTNER

# Adresse du MP (instance application-licence-mp.properties, port 8091).
app.licence.master-url=http://localhost:8091

# Identifiants du CompteLicence a creer MANUELLEMENT sur le MP (/intra/licence/comptes) AVANT que
# cette instance ne reussisse son auto-enrolement — login/mot de passe EN CLAIR choisis par l'admin
# a la creation du compte, a reporter ICI a l'identique. Fournis par variable d'environnement plutot
# que codes en dur, meme discipline que app.sync.api-key dans application-sync-client.properties.
# JAMAIS app.licence.jeton en meme temps (exactement une des deux methodes, voir LicenceBootstrap).
app.licence.login=${LICENCE_LOGIN:}
app.licence.mot-de-passe=${LICENCE_MOT_DE_PASSE:}

# Adresse PUBLIQUE de cette instance (URL complete, meme port que server.port ci-dessus), relayee
# aux clients comme adressePartenaireResolue et utilisee telle quelle comme URL de base pour leur
# POST /api/sync/enroll — sans elle, l'auto-detection ne donnerait qu'une IP nue (sans schema ni
# port), inutilisable, et une correction manuelle sur l'ecran MP serait necessaire. Voir
# LicenceBootstrap#adresseDeclaree et application-licence.properties.example.
app.licence.adresse-publique=http://localhost:8092

# Cycles rapides pour la validation manuelle (defauts : 5000 / 5000 — voir LicenceBootstrap et
# LicenceDecouverteScheduler, qui partagent ces deux proprietes).
app.licence.poll-interval-ms=2000
app.licence.initial-delay-ms=2000

# PAS de app.sync.* ici : un PARTENAIRE est le cote RECEPTEUR (passif) du moteur de synchronisation
# pour SES clients (meme choix que application-sync-partner.properties) — RestSyncClient/
# SyncOutboxScheduler n'y ont donc aucune raison d'etre actifs.

# Captcha Turnstile DESACTIVE pour cette validation locale UNIQUEMENT : application.properties
# l'active par defaut (captcha.enabled=${CAPTCHA_ENABLED:true}), ce qui bloquerait tout POST /login
# scripte (java.net.http.HttpClient, aucun navigateur pour resoudre le challenge) — voir
# EndToEndLicenceTest#sessionClient et task-7-report.md. NE JAMAIS copier cette ligne dans un profil
# de deploiement reel.
captcha.enabled=false
