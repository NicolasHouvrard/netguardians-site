# Profil de TEST de la synchronisation (Task 5) : instance "client" (secondaire, initie tout : push + pull).
# A cumuler avec le profil local : -Dspring-boot.run.profiles=local,sync-client
# Ne surcharge que ce qui change par rapport a "local".

server.port=8082

# Base SEPAREE, jamais partagee avec l'instance partenaire (site_db).
spring.datasource.url=jdbc:postgresql://localhost:5432/site_db_secondaire
# Base neuve : Hibernate doit creer le schema AVANT les scripts spring.sql.init (voir application.properties).
spring.jpa.defer-datasource-initialization=true

app.role=CLIENT
app.sync.master-url=http://localhost:8081

# Cle API recue a l'enrolement (POST <partenaire>/api/sync/enroll). JAMAIS commitee ici : fournie au
# lancement par la variable d'environnement SYNC_API_KEY (ou --app.sync.api-key=...). Lue au demarrage
# par RestSyncClient : redemarrer l'instance apres l'avoir changee.
app.sync.api-key=${SYNC_API_KEY:}

# Cycles rapides pour la validation manuelle (defauts : 5000 / 5000).
app.sync.poll-interval-ms=2000
app.sync.initial-delay-ms=2000
