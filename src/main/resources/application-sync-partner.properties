# Profil de TEST de la synchronisation (Task 5) : instance "partenaire" (maitre au sens du protocole).
# A cumuler avec le profil local : -Dspring-boot.run.profiles=local,sync-partner
# Ne surcharge que ce qui change par rapport a "local" (base site_db conservee).
#
# PAS de app.sync.master-url : cette instance est le cote RECEPTEUR (passif). Le scheduler de
# synchronisation (SyncOutboxScheduler/RestSyncClient) n'y est donc pas cree ; elle sert
# POST /api/sync/enroll et GET/POST /api/sync/events aux secondaires enroles.
server.port=8081
app.role=PARTNER
