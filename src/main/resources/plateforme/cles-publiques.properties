# Cles publiques de confiance pour la signature des jars de plugins (Ed25519).
# Format : <keyId>=<cle publique X.509 en base64>, telle qu'ecrite dans <keyId>.public par
#   java -cp plugins-sdk.jar com.logicielpourtous.site.sdk.OutilSignature generer-cles <dossier> <keyId>
#
# C'est la SEULE source de cles du coeur : aucune propriete ne permet d'en ajouter a l'execution.
# Au moins deux cles sont attendues (une actuelle + une de secours pour la rotation) ; avec moins de
# deux, un avertissement s'affiche au demarrage. Une entree illisible est ignoree ET signalee.
# Avec app.plateforme.signature-obligatoire=true (defaut), une ressource absente, vide ou sans
# aucune cle lisible EMPECHE la plateforme de demarrer (jamais de coeur qui accepterait tout jar).
#
# !! CLES DE DEVELOPPEMENT (keyId prefixe « dev- ») : generees pour ce depot le 2026-11-13 ; leurs
# !! cles PRIVEES ont ete DETRUITES aussitot (jamais committees, conservees nulle part). Le coeur tel
# !! qu'il est livre n'accepte donc AUCUN jar reel (fail-closed) tant que ces deux lignes ne sont pas
# !! remplacees par les cles publiques de PRODUCTION, generees par l'administrateur sur le poste de
# !! signature dedie (la cle privee ne quitte jamais ce poste). Rotation = nouvelle version du coeur
# !! listant l'ancienne et la nouvelle cle.
# !! Developpement local : app.plateforme.signature-obligatoire=false (aucun jar n'est alors verifie).
