<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle} ?: 'Boutique'">Boutique</title>

    <meta th:if="${metaDesc}" name="description" th:content="${metaDesc}">
    <link th:if="${canonical}" rel="canonical" th:href="${canonical}">

    <!-- Open Graph -->
    <meta property="og:title"       th:content="${pageTitle} ?: 'Boutique'">
    <meta th:if="${metaDesc}"   property="og:description" th:content="${metaDesc}">
    <meta th:if="${canonical}"  property="og:url"         th:content="${canonical}">
    <meta th:if="${ogImage}"    property="og:image"       th:content="${ogImage}">
    <meta property="og:type" content="website">

    <!-- JSON-LD -->
    <script th:if="${jsonLd}" type="application/ld+json" th:utext="${jsonLd}"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .boutique-nav {
            background: #1e293b;
            padding: .75rem 0;
        }
        .boutique-nav .navbar-brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: .02em;
        }
        .boutique-nav .nav-link {
            color: rgba(255,255,255,.8);
            font-size: .9rem;
        }
        .boutique-nav .nav-link:hover { color: #fff; }
        .boutique-nav .cart-badge {
            position: relative;
            display: inline-block;
        }
        .boutique-nav .cart-badge .badge {
            position: absolute;
            top: -8px;
            right: -10px;
            font-size: .65rem;
        }
        .boutique-footer {
            background: #1e293b;
            color: rgba(255,255,255,.6);
            font-size: .82rem;
            padding: 2rem 0;
            margin-top: 4rem;
        }
        .boutique-footer a { color: rgba(255,255,255,.7); text-decoration: none; }
        .boutique-footer a:hover { color: #fff; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="boutique-nav navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/boutique}" th:text="${shopName} ?: 'Boutique'">Boutique</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#boutiqueNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="boutiqueNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/boutique}"><i class="fas fa-th-large me-1"></i>Catalogue</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link cart-badge" th:href="@{/boutique/panier}">
                        <i class="fas fa-shopping-cart fa-lg"></i>
                        <span th:if="${cartCount > 0}" class="badge bg-danger rounded-pill"
                              th:text="${cartCount}">0</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/espace}"><i class="fas fa-user-circle me-1"></i>Mon espace</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/login}">Connexion</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Flash messages -->
<div th:if="${successMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div class="alert alert-success alert-dismissible fade show shadow-sm mb-0">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<div th:if="${errorMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div class="alert alert-danger alert-dismissible fade show shadow-sm mb-0">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<main class="container py-4">
    <div layout:fragment="content"></div>
</main>

<!-- Footer -->
<footer class="boutique-footer">
    <div class="container text-center">
        <p class="mb-1" th:text="${shopName} ?: 'Boutique'">&copy; Boutique</p>
        <p class="mb-0">
            <a th:href="@{/boutique}">Catalogue</a> &bull;
            <a th:href="@{/boutique/panier}">Panier</a>
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
