<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changement de mot de passe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container-sm py-5" style="max-width:440px">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-warning bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:56px;height:56px">
                    <i class="fas fa-lock text-warning fa-lg"></i>
                </div>
                <h5 class="fw-bold mb-1">Changement de mot de passe requis</h5>
                <p class="text-muted small mb-0">Définissez un nouveau mot de passe pour accéder à votre compte.</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3" th:text="${errorMessage}"></div>

            <form method="post" action="/change-password">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Nouveau mot de passe <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" required minlength="8"
                           autofocus autocomplete="new-password" placeholder="8 caractères minimum">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small">Confirmer le mot de passe <span class="text-danger">*</span></label>
                    <input type="password" name="confirmPassword" class="form-control" required minlength="8"
                           autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-check me-2"></i>Enregistrer le mot de passe
                </button>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
