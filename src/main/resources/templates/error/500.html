<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Erreur serveur</title>
</head>
<body>
<section layout:fragment="content">
    <div class="error-card text-center py-5">
        <div class="mb-3">
            <i class="fas fa-exclamation-triangle text-danger fa-4x"></i>
        </div>
        <h1 class="display-4 fw-bold">500</h1>
        <h2 class="mb-3">Erreur interne du serveur</h2>
        <p class="text-muted mb-4">
            Désolé, une erreur technique est survenue. La page est momentanément indisponible.
        </p>
        <a th:href="@{/}" class="btn btn-primary">
            <i class="fas fa-home me-2"></i>Retour à l'accueil
        </a>
    </div>
</section>
</body>
</html>
