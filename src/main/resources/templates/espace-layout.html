<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Mon Espace">Mon Espace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .espace-topnav {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .espace-topnav .navbar-brand {
            color: #fff;
            font-weight: 600;
            font-size: .95rem;
        }
        .espace-topnav .nav-link {
            color: rgba(255,255,255,.75);
            font-size: .85rem;
            padding: .5rem .9rem;
        }
        .espace-topnav .nav-link:hover,
        .espace-topnav .nav-link.show {
            color: #fff;
            background: rgba(255,255,255,.1);
            border-radius: .375rem;
        }
        .espace-topnav .dropdown-menu {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,.12);
            min-width: 200px;
        }
        .espace-topnav .dropdown-item {
            color: rgba(255,255,255,.8);
            font-size: .85rem;
            padding: .45rem 1rem;
        }
        .espace-topnav .dropdown-item:hover,
        .espace-topnav .dropdown-item.active {
            background: rgba(255,255,255,.12);
            color: #fff;
        }
        .espace-topnav .dropdown-item i {
            width: 18px;
        }
        .espace-main {
            background: #f8f9fa;
            min-height: calc(100vh - 120px);
        }
        /* Dashboard banner */
        .dashboard-banner {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }
        .dashboard-widget {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: background .15s;
            min-width: 110px;
        }
        .dashboard-widget:hover { background: #f1f5f9; }
        .dashboard-widget__value { font-size: 1.1rem; color: #1e293b; }
        .dashboard-widget__label { font-size: .68rem; white-space: nowrap; }
        .dashboard-widget__icon  { font-size: .85rem; }
    </style>
</head>
<body>

<div th:replace="~{header/all :: navbar}"></div>

<!-- Windows-style horizontal module nav -->
<nav class="espace-topnav navbar navbar-expand py-1">
    <div class="container-fluid px-3">
        <a href="/espace" class="navbar-brand me-3">
            <i class="fas fa-th-large me-1"></i>Mon Espace
        </a>

        <div th:replace="~{espace/nav :: sections}"></div>
    </div>
</nav>

<div th:replace="~{espace/dashboard-banner :: banner}"></div>

<main class="espace-main p-4">
    <div layout:fragment="content"></div>
</main>

<div th:if="${successMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div class="alert alert-success alert-dismissible fade show shadow-sm mb-0">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<div th:if="${errorMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div class="alert alert-danger alert-dismissible fade show shadow-sm mb-0">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer>
    <small>&copy; 2026 LogicielPourTous - Nicolas App v4.0.2</small>
</footer>

<script>
function cleanupBootstrapArtifacts() {
    document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
    document.body.classList.remove('modal-open');
    document.body.style.overflow = '';
    document.body.style.paddingRight = '';
}
function hideAllModals() {
    document.querySelectorAll('.modal.show').forEach(el => {
        const m = bootstrap.Modal.getInstance(el);
        if (m) m.hide();
    });
}
window.addEventListener('load', cleanupBootstrapArtifacts);
document.body.addEventListener('htmx:afterOnLoad',  cleanupBootstrapArtifacts);
document.body.addEventListener('htmx:afterSwap',    cleanupBootstrapArtifacts);
document.body.addEventListener('htmx:afterSettle',  cleanupBootstrapArtifacts);
document.body.addEventListener('htmx:beforeRequest', hideAllModals);
</script>
<th:block layout:fragment="script"></th:block>
</body>
</html>
