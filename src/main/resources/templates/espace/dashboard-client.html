<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{espace-layout}">
<head><title>Mon espace</title></head>
<body>
<div layout:fragment="content">

    <!-- Welcome -->
    <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 fw-bold mb-1">
                Bonjour<span th:if="${customer != null}">,
                    <span th:text="${customer.companyName}">Entreprise</span>
                </span>&nbsp;👋
            </h1>
            <p class="text-muted mb-0 small">Bienvenue dans votre espace personnel.</p>
        </div>
        <a href="/espace/tickets/new" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nouveau ticket
        </a>
    </div>

    <!-- KPI cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
            <a href="/espace/tickets" class="card border-0 shadow-sm text-decoration-none h-100"
               style="border-left:4px solid #f59e0b !important">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                          style="background:#f59e0b20;width:44px;height:44px">
                        <i class="fas fa-headset" style="color:#f59e0b;font-size:1.1rem"></i>
                    </span>
                    <div>
                        <div class="fw-bold" style="font-size:1.6rem;line-height:1"
                             th:text="${openTickets != null ? openTickets : '—'}">—</div>
                        <div class="text-muted" style="font-size:.73rem">Tickets ouverts</div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-6 col-md-4">
            <a href="/espace/subscriptions" class="card border-0 shadow-sm text-decoration-none h-100"
               style="border-left:4px solid #10b981 !important">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                          style="background:#10b98120;width:44px;height:44px">
                        <i class="fas fa-box-open" style="color:#10b981;font-size:1.1rem"></i>
                    </span>
                    <div>
                        <div class="fw-bold" style="font-size:1.6rem;line-height:1"
                             th:text="${activeSubsCount != null ? activeSubsCount : '—'}">—</div>
                        <div class="text-muted" style="font-size:.73rem">Abonnements actifs</div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-6 col-md-4">
            <a href="/espace/devices" class="card border-0 shadow-sm text-decoration-none h-100"
               style="border-left:4px solid #6366f1 !important">
                <div class="card-body d-flex align-items-center gap-3 py-3">
                    <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                          style="background:#6366f120;width:44px;height:44px">
                        <i class="fas fa-laptop" style="color:#6366f1;font-size:1.1rem"></i>
                    </span>
                    <div>
                        <div class="fw-bold" style="font-size:1.6rem;line-height:1">—</div>
                        <div class="text-muted" style="font-size:.73rem">Appareils</div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Activité récente -->
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">
                        <i class="fas fa-headset me-2 text-warning"></i>Mes tickets en cours
                    </span>
                    <a href="/espace/tickets" class="btn btn-sm btn-outline-secondary">Voir tout</a>
                </div>
                <div th:if="${#lists.isEmpty(recentTickets)}" class="card-body py-4 text-center text-muted small">
                    <i class="fas fa-check-circle me-1 text-success"></i>Aucun ticket ouvert
                </div>
                <ul th:unless="${#lists.isEmpty(recentTickets)}" class="list-group list-group-flush">
                    <li th:each="t : ${recentTickets}"
                        class="list-group-item list-group-item-action px-3 py-2">
                        <a th:href="@{/espace/tickets/{id}(id=${t.id})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-start">
                            <div class="overflow-hidden me-2">
                                <div class="fw-semibold small text-truncate" th:text="${t.title}">Titre</div>
                                <div class="text-muted" style="font-size:.75rem"
                                     th:text="${t.type != null ? t.type.name() : 'Demande'}"></div>
                            </div>
                            <div class="flex-shrink-0 text-end">
                                <span class="badge rounded-pill"
                                      th:text="${t.status.label}"
                                      th:classappend="${t.status.name() == 'NEW' ? ' bg-danger' : ' bg-warning text-dark'}">
                                </span>
                                <div class="text-muted mt-1" style="font-size:.7rem"
                                     th:text="${#temporals.format(t.createdAt,'dd/MM/yy')}"></div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Actions rapides -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom fw-semibold">
                    <i class="fas fa-bolt me-2 text-primary"></i>Actions rapides
                </div>
                <div class="list-group list-group-flush">
                    <a href="/espace/tickets/new"
                       class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#6366f120;width:36px;height:36px">
                            <i class="fas fa-plus" style="color:#6366f1"></i>
                        </span>
                        <span class="small fw-semibold">Ouvrir un ticket</span>
                    </a>
                    <a href="/espace/subscriptions"
                       class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#10b98120;width:36px;height:36px">
                            <i class="fas fa-box-open" style="color:#10b981"></i>
                        </span>
                        <span class="small fw-semibold">Mes abonnements</span>
                    </a>
                    <a href="/espace/orders"
                       class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#f59e0b20;width:36px;height:36px">
                            <i class="fas fa-shopping-bag" style="color:#f59e0b"></i>
                        </span>
                        <span class="small fw-semibold">Mes commandes</span>
                    </a>
                    <a href="/espace/profile"
                       class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#64748b20;width:36px;height:36px">
                            <i class="fas fa-user" style="color:#64748b"></i>
                        </span>
                        <span class="small fw-semibold">Mon profil</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
