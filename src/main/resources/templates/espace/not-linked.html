<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{espace-layout}">
<head><title>Compte non configuré</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-center" style="min-height:60vh">
        <div class="text-center">
            <i class="fas fa-user-slash fa-4x text-muted mb-4 d-block"></i>
            <h4 class="fw-bold">Compte non lié à un client</h4>
            <p class="text-muted mb-4">
                Votre compte n'est pas encore associé à un dossier client.<br>
                Contactez votre prestataire pour activer votre accès.
            </p>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-secondary">
                    <i class="fas fa-sign-out-alt me-1"></i>Se déconnecter
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
