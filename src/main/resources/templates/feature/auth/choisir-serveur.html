<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Choisir un serveur</title>
</head>
<body>
    <section layout:fragment="content">
        <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 p-4">
                    <h2 class="text-center mb-2">Choisir une société</h2>
                    <p class="text-center text-muted mb-4">
                        Votre compte est présent sur plusieurs serveurs. Choisissez la société à laquelle vous souhaitez vous connecter.
                    </p>

                    <form th:action="@{/connexion/aiguillage}" method="post" class="list-group">
                        <button th:each="nom, etat : ${serveurs}" type="submit" name="index" th:value="${etat.index}"
                                class="list-group-item list-group-item-action rounded border mb-2">
                            <i class="fas fa-building me-2"></i>
                            <strong th:text="${nom}">Société</strong>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="btn btn-link">Retour à la connexion</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
