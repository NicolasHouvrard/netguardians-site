<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Choisir une société</title>
</head>
<body>
    <section layout:fragment="content">
        <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 p-4">
                    <h2 class="text-center mb-2">Choisir une société</h2>
                    <p class="text-center text-muted mb-4" th:if="${selectionRequise}">
                        Votre compte est rattaché à plusieurs sociétés. Choisissez celle avec laquelle vous souhaitez travailler.
                    </p>
                    <p class="text-center text-muted mb-4" th:unless="${selectionRequise}">
                        Choisissez la société avec laquelle vous souhaitez travailler.
                    </p>

                    <div class="list-group">
                        <form th:each="s : ${societes}" th:action="@{/choisir-societe}" method="post" class="mb-2">
                            <input type="hidden" name="appartenanceId" th:value="${s.appartenanceId}">
                            <button type="submit"
                                    class="list-group-item list-group-item-action d-flex justify-content-between align-items-center rounded border"
                                    th:classappend="${s.active} ? 'active' : ''">
                                <span>
                                    <i class="fas fa-building me-2"></i>
                                    <strong th:text="${s.societe}">Société</strong>
                                    <span th:if="${s.fiche != null}" class="d-block small text-muted ms-4"
                                          th:text="${s.fiche}">Fiche client</span>
                                </span>
                                <span th:if="${s.active}" class="badge bg-light text-dark">Société active</span>
                            </button>
                        </form>
                    </div>

                    <form th:action="@{/logout}" method="post" class="text-center mt-3">
                        <button type="submit" class="btn btn-link text-danger">
                            <i class="fas fa-sign-out-alt me-1"></i>Déconnexion
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
