<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Déconnecté</title>
</head>
<body>
    <section layout:fragment="content">
        <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 p-4">
                    <h2 class="text-center mb-3">Déconnexion</h2>
                    <p class="text-center mb-3">Vous êtes déconnecté du site.</p>

                    <div th:if="${lienAuthelia != null}" class="text-center mb-3">
                        <p class="text-muted">Sur un poste partagé, cliquez pour fermer aussi la session du compte unique.</p>
                        <a th:href="${lienAuthelia}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary">
                            Fermer aussi la session du compte unique
                        </a>
                    </div>

                    <div class="text-center mt-2">
                        <a th:href="@{/login}" class="btn btn-link">Retour à la connexion</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
