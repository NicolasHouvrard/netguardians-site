<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Demandes de société connue</title></head>
<body>
<div layout:fragment="content">
    <div class="pt-2">
        <h1 class="h3 fw-bold mb-1">Demandes de société connue</h1>
        <p class="text-muted small mb-4">Personnes qui ont tenté d'inscrire une de vos sociétés déjà enregistrée.</p>

        <div th:if="${#lists.isEmpty(demandes)}" class="alert alert-light border">Aucune demande en attente.</div>

        <div th:unless="${#lists.isEmpty(demandes)}" class="card border-0 shadow-sm">
            <table class="table mb-0 align-middle">
                <thead>
                <tr><th>Date</th><th>Demandeur</th><th>E-mail</th><th>SIREN</th><th>TVA</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="d : ${demandes}">
                    <td th:text="${#temporals.format(d.creeA, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${d.nom}"></td>
                    <td th:text="${d.email}"></td>
                    <td th:text="${d.siren}"></td>
                    <td th:text="${d.tva}"></td>
                    <td class="text-end">
                        <form th:action="@{/intra/demandes-societe-connue/{id}/traitee(id=${d.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">Marquer comme traitée</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
