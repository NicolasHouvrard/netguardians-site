<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
       layout:decorate="~{layout}">  
<head>
    <title>Connexion</title>
    <th:block th:if="${captchaEnabled and !autheliaEnabled}">
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </th:block>
</head>
<body>
    <section layout:fragment="content">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-md-4">
                <div class="card shadow border-0 p-4">
                    <h2 class="text-center mb-4">Connexion</h2>
                    
                    <th:block th:replace="~{feature/auth/login-elements :: messages}"></th:block>

                    <!-- Compte unique par defaut : le formulaire local n'est PAS rendu (il vit sur /login/secours). -->
                    <th:block th:if="${autheliaEnabled}">
                        <div class="d-grid">
                            <a href="/oauth2/authorization/authelia" class="btn btn-primary btn-lg">Se connecter</a>
                        </div>
                        <p class="text-center text-muted small mt-3 mb-0">Vous utilisez le compte unique de Logiciel pour tous.</p>
                        <div class="text-center mt-3" th:if="${portailOubliUrl != null}">
                            <a th:href="${portailOubliUrl}" class="text-muted small">Mot de passe oublié ?</a>
                        </div>
                    </th:block>

                    <th:block th:unless="${autheliaEnabled}">
                        <th:block th:replace="~{feature/auth/login-elements :: formulaire(false)}"></th:block>
                        <div class="text-center mt-3">
                            <a href="/reset-password" class="text-muted small">Mot de passe oublié ?</a>
                        </div>
                    </th:block>
                    <div th:if="${param.reset}" class="alert alert-success mt-3 mb-0">
                        Votre mot de passe a été réinitialisé. Vous pouvez vous connecter.
                    </div>

                    <!-- Social login -->
                    <div th:if="${googleEnabled or microsoftEnabled}">
                        <div class="position-relative my-4">
                            <hr>
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted"
                                  style="font-size:.8rem">ou continuer avec</span>
                        </div>
                        <div class="d-grid gap-2">
                            <a th:if="${googleEnabled}" href="/oauth2/authorization/google"
                               class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                                </svg>
                                Continuer avec Google
                            </a>
                            <a th:if="${microsoftEnabled}" href="/oauth2/authorization/microsoft"
                               class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 23 23">
                                    <rect x="1"  y="1"  width="10" height="10" fill="#F35325"/>
                                    <rect x="12" y="1"  width="10" height="10" fill="#81BC06"/>
                                    <rect x="1"  y="12" width="10" height="10" fill="#05A6F0"/>
                                    <rect x="12" y="12" width="10" height="10" fill="#FFBA08"/>
                                </svg>
                                Continuer avec Microsoft
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
