<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Demande envoyée</title></head>
<body>
<section layout:fragment="content">
<div class="row justify-content-center align-items-center" style="min-height:80vh">
<div class="col-md-5 text-center">
    <div class="card border-0 shadow-sm p-5">
        <div class="mb-4">
            <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-10"
                  style="width:72px;height:72px">
                <i class="fas fa-check-circle fa-2x text-success"></i>
            </span>
        </div>
        <h3 class="fw-bold mb-2">Demande envoyée !</h3>
        <p class="text-muted mb-4">
            Votre demande d'abonnement ESN a bien été reçue.<br>
            Notre équipe va l'examiner et vous contactera sous <strong>24 heures</strong>
            pour finaliser votre accès.
        </p>
        <div class="bg-light rounded p-3 mb-4 text-start small">
            <div class="d-flex gap-2 mb-2">
                <i class="fas fa-envelope text-muted mt-1"></i>
                <span>Un récapitulatif vous sera envoyé par email.</span>
            </div>
            <div class="d-flex gap-2">
                <i class="fas fa-headset text-muted mt-1"></i>
                <span>Pour toute question : <strong>contact@logicielpourtous.com</strong></span>
            </div>
        </div>
        <a th:href="@{/login}" class="btn btn-outline-secondary">
            <i class="fas fa-sign-in-alt me-1"></i>Retour à la connexion
        </a>
    </div>
</div>
</div>
</section>
</body>
</html>
