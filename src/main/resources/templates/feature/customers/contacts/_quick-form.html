<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ── Formulaire chargé dans la modale ──────────────────────────────── -->
<div th:fragment="form">
    <form th:hx-post="@{/intra/customers/{cid}/contacts/quick-save(cid=${customerId})}"
          hx-target="#quickContactModalBody"
          hx-swap="innerHTML">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Prénom *</label>
                <input type="text" name="firstName" class="form-control" required autofocus>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Nom *</label>
                <input type="text" name="lastName" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Téléphone</label>
                <input type="text" name="phone" class="form-control">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Poste / Fonction</label>
                <input type="text" name="position" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Site</label>
                <select name="selectedSiteId" class="form-select">
                    <option value="">— Aucun —</option>
                    <option th:each="s : ${customerSites}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-1"></i> Créer le contact
            </button>
        </div>
    </form>
</div>

<!--
  ── Réponse après sauvegarde ─────────────────────────────────────────────
  HTMX attend deux parties :
    1. Un contenu PRINCIPAL pour hx-target="#quickContactModalBody" (le <div>)
    2. Un élément OOB pour injecter l'option dans #contactSelect (l'<option>)
  HX-Trigger-After-Settle déclenche le JS côté page APRÈS que l'OOB est posé.
-->
<th:block th:fragment="new-option">

    <!-- Contenu principal : confirmation dans la modale -->
    <div class="text-center py-4 text-success">
        <i class="fas fa-check-circle fa-3x mb-2"></i>
        <p class="fw-bold mb-0"
           th:text="${contact.firstName + ' ' + contact.lastName + ' créé(e) !'}"></p>
    </div>

    <!-- OOB : nouvelle option injectée dans le select contact -->
    <option hx-swap-oob="beforeend:#contactSelect"
            th:value="${contact.id}"
            th:attr="data-site-id=${contact.site != null ? contact.site.id : ''},
                     data-site-name=${contact.site != null ? contact.site.name : ''},
                     data-position=${contact.position != null ? contact.position : ''},
                     data-email=${contact.email != null ? contact.email : ''},
                     data-phone=${contact.phone != null ? contact.phone : ''},
                     data-name=${contact.firstName + ' ' + contact.lastName}"
            th:text="${contact.firstName + ' ' + contact.lastName}">
    </option>

</th:block>

</body>
</html>
