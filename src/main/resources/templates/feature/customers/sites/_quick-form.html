<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ── Formulaire chargé dans la modale ──────────────────────────────── -->
<div th:fragment="form">
    <form th:hx-post="@{/intra/customers/{cid}/sites/quick-save(cid=${customerId})}"
          hx-target="#quickSiteModalBody"
          hx-swap="innerHTML">

        <div class="mb-3">
            <label class="form-label fw-bold">Nom du site *</label>
            <input type="text" name="name" class="form-control" required autofocus
                   placeholder="Ex : Siège, Entrepôt Nord, Agence Lyon…">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Adresse</label>
            <input type="text" name="address" class="form-control">
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">Code postal</label>
                <input type="text" name="zipCode" class="form-control">
            </div>
            <div class="col-md-8 mb-3">
                <label class="form-label fw-bold">Ville</label>
                <input type="text" name="city" class="form-control">
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-1"></i> Créer le site
            </button>
        </div>
    </form>
</div>

<!-- ── Réponse après sauvegarde ────────────────────────────────────────── -->
<th:block th:fragment="new-option">

    <!-- Contenu principal -->
    <div class="text-center py-4 text-success">
        <i class="fas fa-check-circle fa-3x mb-2"></i>
        <p class="fw-bold mb-0" th:text="${site.name + ' créé !'}"></p>
    </div>

    <!-- OOB : nouvelle option dans le select site -->
    <option hx-swap-oob="beforeend:#siteSelect"
            th:value="${site.id}"
            th:text="${site.name}">
    </option>

</th:block>

</body>
</html>
