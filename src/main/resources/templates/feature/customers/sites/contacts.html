<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin-layout}">
<head>
    <title>Contacts du site</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 mb-0 text-gray-800">
                    Contacts — <span th:text="${site.name}" class="text-primary"></span>
                </h1>
                <small class="text-muted">
                    <span th:text="${customer.companyName}"></span>
                    &nbsp;·&nbsp;
                    <span th:text="${site.address + ', ' + site.zipCode + ' ' + site.city}"></span>
                </small>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/intra/customers/edit/{id}#sites-pane(id=${customer.id})}"
                   class="btn btn-secondary btn-sm shadow-sm">
                    <i class="fas fa-arrow-left fa-sm"></i> Retour au client
                </a>
                <a th:href="@{/intra/customers/{cid}/sites/{sid}/contacts/new(cid=${customer.id},sid=${site.id})}"
                   class="btn btn-primary btn-sm shadow-sm">
                    <i class="fas fa-plus fa-sm"></i> Ajouter un contact
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Prénom / Nom</th>
                                <th>Email</th>
                                <th>Téléphone</th>
                                <th>Poste</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="contact : ${site.contacts}">
                                <td class="fw-bold" th:text="${contact.fullName}"></td>
                                <td th:text="${contact.email}"></td>
                                <td th:text="${contact.phone}"></td>
                                <td th:text="${contact.position}"></td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/intra/customers/{cid}/sites/{sid}/contacts/edit/{id}(cid=${customer.id},sid=${site.id},id=${contact.id})}"
                                           class="btn btn-sm btn-outline-info" title="Modifier">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/intra/customers/{cid}/sites/{sid}/contacts/delete/{id}(cid=${customer.id},sid=${site.id},id=${contact.id})}"
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('Supprimer ce contact ?')" title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(site.contacts)}">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    Aucun contact enregistré pour ce site.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
