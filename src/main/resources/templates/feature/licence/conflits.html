<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Conflits de synchronisation</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <h4 class="mb-0"><i class="fas fa-triangle-exclamation me-2 text-warning"></i>Conflits de synchronisation</h4>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3 pb-2">
            <h6 class="fw-bold mb-0">Conflits à trancher</h6>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(conflits)}" class="text-center py-5 text-muted">
                Aucun conflit en attente.
            </div>
            <table th:unless="${#lists.isEmpty(conflits)}" class="table table-sm align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Demande (syncId)</th>
                    <th class="text-center">Version attendue</th>
                    <th class="text-center">Version reçue</th>
                    <th>Payload reçu</th>
                    <th>Détecté le</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="conflit : ${conflits}">
                    <td><code th:text="${conflit.entitySyncId}"></code></td>
                    <td class="text-center" th:text="${conflit.versionAttendue}"></td>
                    <td class="text-center" th:text="${conflit.versionRecue}"></td>
                    <td><code class="small" th:text="${conflit.payloadRecu}"></code></td>
                    <td th:text="${conflit.creeA}"></td>
                    <td class="text-end">
                        <form th:action="@{/intra/licence/conflits/{id}/appliquer(id=${conflit.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Appliquer le payload reçu (remplace l\'état actuel) ?')">
                            <button type="submit" class="btn btn-xs py-0 px-2 btn-outline-primary">
                                <i class="fas fa-check"></i> Appliquer le reçu
                            </button>
                        </form>
                        <form th:action="@{/intra/licence/conflits/{id}/garder(id=${conflit.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Garder l\'état actuel (ignore le payload reçu) ?')">
                            <button type="submit" class="btn btn-xs py-0 px-2 btn-outline-secondary">
                                <i class="fas fa-shield"></i> Garder l'actuel
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
