<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Doublons de sociétés</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <h4 class="mb-0"><i class="fas fa-clone me-2 text-primary"></i>Doublons de sociétés</h4>
        <a th:href="@{/intra/licence/federation}" class="btn btn-sm btn-outline-secondary ms-auto">
            <i class="fas fa-project-diagram me-1"></i>Fédération des serveurs
        </a>
    </div>

    <p class="text-muted small">
        Sociétés qui partagent un même SIREN (ou une même TVA pour les sociétés étrangères) dans les clients, les
        tenants et les ESN. Aucune fusion automatique : corrigez ou supprimez les fiches à la main.
    </p>

    <div th:if="${#lists.isEmpty(groupes)}" class="alert alert-success">
        Aucun doublon détecté.
    </div>

    <div th:each="g : ${groupes}" class="card border-0 shadow-sm mb-3">
        <div class="card-header bg-white border-0 pt-3 pb-2">
            <h6 class="fw-bold mb-0">
                <span th:text="${g.nature}" class="badge bg-warning text-dark me-2"></span>
                <code th:text="${g.cle}"></code>
                <span class="text-muted small ms-2" th:text="${#lists.size(g.lignes) + ' fiches'}"></span>
            </h6>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm align-middle mb-0">
                <thead class="table-light">
                <tr><th>Table</th><th>Identifiant</th><th>Nom</th></tr>
                </thead>
                <tbody>
                <tr th:each="l : ${g.lignes}">
                    <td><code th:text="${l.table}"></code></td>
                    <td th:text="${l.id}"></td>
                    <td th:text="${l.nom}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
