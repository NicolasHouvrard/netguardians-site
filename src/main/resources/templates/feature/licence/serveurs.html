<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Serveurs secondaires (sync)</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <h4 class="mb-0"><i class="fas fa-server me-2 text-primary"></i>Serveurs secondaires (synchronisation)</h4>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-3 pb-2">
                    <h6 class="fw-bold mb-0">Serveurs enrôlés</h6>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(serveurs)}" class="text-center py-5 text-muted">
                        Aucun serveur secondaire. Créez le premier.
                    </div>
                    <table th:unless="${#lists.isEmpty(serveurs)}" class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Nom</th>
                            <th>Rôle</th>
                            <th>Client (customerId)</th>
                            <th class="text-center">Statut</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="serveur : ${serveurs}" th:classappend="${serveur.statut.name() == 'REVOQUE' ? ' opacity-50' : ''}">
                            <td class="fw-bold" th:text="${serveur.nom}"></td>
                            <td th:text="${serveur.role}"></td>
                            <td th:text="${serveur.customerId != null ? serveur.customerId : '—'}"></td>
                            <td class="text-center">
                                <span class="badge" th:classappend="${serveur.statut.name() == 'ACTIF' ? 'text-bg-success' : 'text-bg-secondary'}"
                                      th:text="${serveur.statut}"></span>
                            </td>
                            <td class="text-end">
                                <form th:if="${serveur.statut.name() == 'ACTIF'}"
                                      th:action="@{/intra/licence/serveurs/{id}/revoquer(id=${serveur.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Révoquer ce serveur ?')">
                                    <button type="submit" class="btn btn-xs py-0 px-2 btn-outline-danger">
                                        <i class="fas fa-ban"></i> Révoquer
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${estPartner}" class="card border-0 shadow-sm mt-4">
                <div class="card-header bg-white border-0 pt-3 pb-2">
                    <h6 class="fw-bold mb-0"><i class="fas fa-ticket me-1 text-primary"></i>Générer un jeton d'installation</h6>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(customers)}" class="text-center py-4 text-muted">
                        Aucun client.
                    </div>
                    <table th:unless="${#lists.isEmpty(customers)}" class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Client</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="customer : ${customers}">
                            <td th:text="${customer.companyName}"></td>
                            <td class="text-end">
                                <form th:action="@{/intra/licence/serveurs/jetons}" method="post" class="d-inline">
                                    <input type="hidden" name="customerId" th:value="${customer.id}">
                                    <button type="submit" class="btn btn-xs py-0 px-2 btn-outline-primary">
                                        <i class="fas fa-ticket"></i> Générer un jeton d'installation
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white border-0 pt-3 pb-2">
                    <h6 class="fw-bold mb-0"><i class="fas fa-plus me-1 text-primary"></i>Nouveau serveur</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/intra/licence/serveurs}" method="post">
                        <div class="mb-2">
                            <label class="form-label small">Nom <span class="text-danger">*</span></label>
                            <input type="text" name="nom" class="form-control form-control-sm" required placeholder="ex : Client Dupont">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Rôle</label>
                            <select name="role" class="form-select form-select-sm">
                                <option value="PARTNER">PARTNER</option>
                                <option value="CLIENT">CLIENT</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Client (facultatif, requis pour un CLIENT)</label>
                            <select name="customerId" class="form-select form-select-sm">
                                <option value="">—</option>
                                <th:block th:each="customer : ${customers}">
                                    <option th:value="${customer.id}" th:text="${customer.companyName}"></option>
                                </th:block>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="fas fa-plus me-1"></i>Créer et générer un code
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
