
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin-layout}"> 
<head>
    
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
<div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Gestion du Support</h1>
    
    <a th:href="@{/admin/request-manager/create}" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
        <i class="fas fa-plus fa-sm text-white-50 mr-1"></i> Nouvelle demande
    </a>
</div>

<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-primary shadow h-100 py-2">
            <div class="card-body">
                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Nouvelles</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" 
                     th:text="${#lists.size(requests.?[status.name() == 'NEW'])}">0</div>
            </div>
            
        </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-warning shadow h-100 py-2">
            <div class="card-body">
                <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">En cours</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" 
                     th:text="${#lists.size(requests.?[status.name() == 'IN_PROGRESS'])}">0</div>
            </div>
        </div>
    </div>
</div>
<div class="card shadow mb-4">
        <div class="card-header py-3 bg-white">
            <h6 class="m-0 font-weight-bold text-primary">File d'attente globale</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped" id="requestTable" width="100%" cellspacing="0">
                    <thead class="thead-light">
                        <tr>
                            <th>Date</th>
                            <th>Client</th>
                            <th>Objet</th>
                            <th>Demandeur</th>
                            <th>Priorité</th>
                            <th>Statut</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req : ${requests}">
                            <td class="align-middle" th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            
                            <td class="align-middle">
                                <a th:href="@{/intra/customers/edit/{id}(id=${req.customer.id})}" class="font-weight-bold">
                                    <i class="fas fa-building mr-1 text-gray-400"></i>
                                    [[${req.customer.companyName}]]
                                </a>
                            </td>
                            
                            <td class="align-middle" th:text="${req.title}">Problème imprimante</td>

                            <td class="align-middle">
                                <small th:text="${req.contact != null ? req.contact.fullName : 'N/A'}"></small>
                            </td>

                            <td class="align-middle">
                                <span th:if="${req.priority != null}" 
                                      th:class="'badge ' + ${req.priority.colorClass}" 
                                      th:text="${req.priority.displayValue}">
                                </span>
                            </td>

                            <td class="align-middle">
                                <div th:replace="~{feature/requests/list :: status-badge(${req.status})}"></div>
                            </td>

                            <td class="text-center align-middle">
                               
                                <div class="dropdown no-arrow">
                                    <button class="dropdown-toggle btn btn-sm btn-light border" 
                                    href="#"
                                     role="button"
                                     data-bs-toggle="dropdown" 
                                     data-bs-boundary="viewport">
                                        <i class="fas fa-ellipsis-v fa-sm fa-fw text-gray-400"></i> Actions
                                    </button>
                                    <div class="dropdown-menu dropdown-menu-right shadow animated--fade-in">
                                        <a class="dropdown-item" th:href="@{/intra/customers/{cId}/requests/edit/{id}(cId=${req.customer.id}, id=${req.id})}" 
                                      >
                                        <i class="fas fa-edit text-primary mr-2"></i> Modifier
                                    </a>
            <div class="dropdown-header">Transformer en :</div>
            <a class="dropdown-item" href="#"><i class="fas fa-file-invoice text-primary mr-2"></i> Créer Devis</a>
            <a class="dropdown-item" href="#"><i class="fas fa-tools text-warning mr-2"></i> Planifier Intervention</a>
            <a class="dropdown-item" href="#"><i class="fas fa-receipt text-info mr-2"></i> Générer Facture</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" th:href="@{/intra/customers/{cId}/requests/delete/{id}(cId=${req.customer.id}, id=${req.id})}" 
                                       
                                       onclick="return confirm('Supprimer cette demande ?')">
                                        <i class="fas fa-trash text-danger mr-2"></i> Supprimer
                                    </a>
        </div>
    </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
</div>
</body>
</html>
