<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin-layout}">
      
 <head>
    <title>Clients</title>
</head> 
<body>
    <section layout:fragment="content">
        <form th:action="@{/admin/settings/modules/save}" th:object="${adminModule}" method="post">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Titre du module</label>
            <input type="hidden" th:field="*{id}" />
            <input type="text" th:field="*{title}" class="form-control" placeholder="ex: Facturation" required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Catégorie (dashboard)</label>
            <select th:field="*{category}" class="form-select">
                <option value="">-- Aucune --</option>
                <option value="Commercial">Commercial</option>
                <option value="Comptabilité">Comptabilité</option>
                <option value="Marketing">Marketing</option>
                <option value="Support">Support</option>
                <option value="Configuration">Configuration</option>
                <option value="Autres">Autres</option>
            </select>
            <small class="text-muted">Détermine dans quel dashboard ce module apparaîtra.</small>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Couleur de la tuile</label>
            <input type="color" th:field="*{color}" class="form-control form-control-color w-100">
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Icône (FontAwesome)</label>
            <div class="input-group">
                <span class="input-group-text"><i id="icon-preview" th:class="*{icon}"></i></span>
                <input type="text" th:field="*{icon}" class="form-control" placeholder="fas fa-envelope" id="icon-input">
            </div>
            <small class="text-muted">Ex: fas fa-file-invoice</small>
        </div>

        <div class="col-md-4 mb-3">
                        <label>URL du module :</label>
            <select name="url" th:field="*{url}" class="form-select">
                <option th:each="item : ${availableRoutes}" 
                        th:value="${item}" 
                        th:text="${item}">
                </option>
            </select>
         </div>
        <div class="col-md-6 mb-3">
    <label class="form-label">Rôle requis (Sécurité)</label>
    <select th:field="*{roleRequired}">
    <option value="">-- PUBLIC --</option>
    <option th:each="r : ${allRoles}" th:value="${r.name}" th:text="${r.name}"></option>
</select>
</div>
    </div>
    <div class="col-md-6 mb-3">
    <label class="form-label">Ordre d'affichage</label>
    <div class="input-group">
        <span class="input-group-text"><i class="fas fa-sort-numeric-down"></i></span>
        <input type="number" th:field="*{displayOrder}" class="form-control" 
               placeholder="Ex: 10" min="1" step="1">
    </div>
    <small class="text-muted">Les chiffres les plus petits apparaissent en premier.</small>
</div>

    <div class="text-end mt-4">
        <button type="submit" class="btn btn-primary">Enregistrer la tuile</button>
    </div>
</form>

<script>
    document.getElementById('icon-input').addEventListener('input', function(e) {
        document.getElementById('icon-preview').className = e.target.value;
    });
</script>
    </section>
 
</body>
</html>
