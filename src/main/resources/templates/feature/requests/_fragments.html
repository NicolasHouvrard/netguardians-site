<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment : options du select Client.
  Cible : innerHTML de #customerSelect
-->
<th:block th:fragment="customer-options">
    <option value="">— Choisir un client —</option>
    <option th:each="c : ${customers}"
            th:value="${c.id}"
            th:text="${c.companyName}">
    </option>
</th:block>

<!--
  Fragment : options du select Site.
  Cible : innerHTML de #siteSelect
  Déclenché par : siteSearch (input) et siteSelect (init)
-->
<th:block th:fragment="site-options">
    <option value="">— Tous les sites —</option>
    <option th:each="s : ${customerSites}"
            th:value="${s.id}"
            th:text="${s.name}">
    </option>
</th:block>

<!--
  Fragment : options du select Contact + OOB clear de la carte détail.
  Cible principale : innerHTML de #contactSelect
  OOB : réinitialise #contactDetailCard (vide la carte quand le site change)
  Déclenché par : siteSelect (change) et contactSearch (input)
-->
<th:block th:fragment="contact-options">
    <option value="">— Sélectionner un contact —</option>
    <option th:each="c : ${contacts}"
            th:value="${c.id}"
            th:text="${c.firstName + ' ' + c.lastName + (c.site != null ? ' (' + c.site.name + ')' : '')}">
    </option>
    <!-- OOB : vider la carte de détail -->
    <div id="contactDetailCard" hx-swap-oob="true"
         class="d-none contact-detail rounded px-3 py-2 mt-3"></div>
</th:block>

<!--
  Fragment : carte de détail du contact.
  Cible : outerHTML de #contactDetailCard
  Déclenché par : contactSelect (change)
-->
<div th:fragment="contact-detail" id="contactDetailCard"
     class="contact-detail rounded px-3 py-2 mt-3"
     th:classappend="${selectedContact == null ? ' d-none' : ''}">
    <div th:if="${selectedContact != null}" class="row g-2 small align-items-center">
        <div class="col-auto fw-bold text-success">
            <i class="fas fa-user me-1"></i>
            <span th:text="${selectedContact.firstName + ' ' + selectedContact.lastName}"></span>
        </div>
        <div class="col-auto text-muted" th:if="${selectedContact.position != null}">
            <i class="fas fa-briefcase me-1"></i>
            <span th:text="${selectedContact.position}"></span>
        </div>
        <div class="col-auto" th:if="${selectedContact.email != null}">
            <i class="fas fa-envelope text-muted me-1"></i>
            <a th:href="'mailto:' + ${selectedContact.email}"
               th:text="${selectedContact.email}"
               class="text-decoration-none"></a>
        </div>
        <div class="col-auto" th:if="${selectedContact.phone != null}">
            <i class="fas fa-phone text-muted me-1"></i>
            <a th:href="'tel:' + ${selectedContact.phone}"
               th:text="${selectedContact.phone}"
               class="text-decoration-none"></a>
        </div>
        <div class="col-auto text-muted" th:if="${selectedContact.site != null}">
            <i class="fas fa-building me-1"></i>
            <span th:text="${selectedContact.site.name}"></span>
        </div>
    </div>
</div>

</body>
</html>
