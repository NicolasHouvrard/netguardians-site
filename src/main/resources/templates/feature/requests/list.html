<div th:fragment="list-requests">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="m-0 font-weight-bold text-primary">
            Historique des demandes (<span th:text="${#lists.size(customer.requests)}">0</span>)
        </h6>
        <a th:href="@{/intra/customers/{id}/requests/add(id=${customer.id})}"
           class="btn btn-primary btn-sm shadow-sm">
            <i class="fas fa-plus-circle fa-sm"></i> Nouvelle demande
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover" width="100%" cellspacing="0">
            <thead class="bg-light">
                <tr>
                    <th style="width:110px">Date</th>
                    <th>Objet</th>
                    <th>Client › Site › Contact</th>
                    <th style="width:100px">Type</th>
                    <th style="width:100px">Statut</th>
                    <th style="width:100px">Temps</th>
                    <th class="text-center" style="width:90px">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${customer.requests}">

                    <td class="small text-muted text-nowrap"
                        th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></td>

                    <td class="fw-bold" th:text="${req.title}"></td>

                    <!-- Colonne origine : client › site › contact -->
                    <td>
                        <div class="d-flex flex-column gap-1 small">
                            <!-- Client -->
                            <div>
                                <i class="fas fa-building fa-xs text-primary me-1"></i>
                                <span th:text="${customer.companyName}" class="fw-semibold"></span>
                            </div>
                            <!-- Site (priorité : req.site, sinon site du contact) -->
                            <div th:with="siteName=${req.site != null ? req.site.name
                                           : (req.contact != null and req.contact.site != null
                                              ? req.contact.site.name : null)}">
                                <span th:if="${siteName != null}" class="text-muted">
                                    <i class="fas fa-map-marker-alt fa-xs me-1"></i>
                                    <span th:text="${siteName}"></span>
                                </span>
                            </div>
                            <!-- Contact -->
                            <div th:if="${req.contact != null}">
                                <i class="fas fa-user fa-xs text-success me-1"></i>
                                <span th:text="${req.contact.firstName + ' ' + req.contact.lastName}"></span>
                                <span th:if="${req.contact.phone}" class="text-muted ms-1">
                                    · <span th:text="${req.contact.phone}"></span>
                                </span>
                            </div>
                        </div>
                    </td>

                    <!-- Type -->
                    <td>
                        <span th:if="${req.type != null}" class="badge text-bg-light border small"
                              th:text="${req.type.label}"></span>
                    </td>

                    <!-- Statut -->
                    <td>
                        <span th:replace="~{::status-badge(${req.status})}"></span>
                    </td>

                    <!-- Temps -->
                    <td class="small text-nowrap">
                        <span th:if="${req.totalSpentMinutes > 0}" class="text-success fw-bold"
                              th:text="${req.formattedSpent}"></span>
                        <span th:if="${req.totalSpentMinutes > 0 and req.estimatedMinutes != null}"
                              class="text-muted"> / </span>
                        <span th:if="${req.estimatedMinutes != null}" class="text-muted"
                              th:text="${req.formattedEstimated}"></span>
                        <span th:if="${req.totalSpentMinutes == 0 and req.estimatedMinutes == null}"
                              class="text-muted">—</span>
                    </td>

                    <td class="text-center">
                        <div class="btn-group">
                            <a th:href="@{/intra/customers/{cId}/requests/edit/{id}(cId=${customer.id},id=${req.id})}"
                               class="btn btn-sm btn-outline-info" title="Voir / Modifier">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/intra/customers/{cId}/requests/delete/{id}(cId=${customer.id},id=${req.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Supprimer cette demande ?')" title="Supprimer">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customer.requests)}">
                    <td colspan="7" class="text-center py-4 text-muted">Aucune demande enregistrée.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<div th:fragment="status-badge(status)">
    <span th:if="${status != null}" th:switch="${status.toString()}">
        <span th:case="'NEW'"         class="badge text-bg-primary">Nouveau</span>
        <span th:case="'IN_PROGRESS'" class="badge text-bg-warning text-dark">En cours</span>
        <span th:case="'COMPLETED'"   class="badge text-bg-success">Terminé</span>
        <span th:case="'CANCELLED'"   class="badge text-bg-secondary">Annulé</span>
        <span th:case="*"             class="badge text-bg-light border" th:text="${status}"></span>
    </span>
    <span th:if="${status == null}" class="badge text-bg-light border text-muted">—</span>
</div>
