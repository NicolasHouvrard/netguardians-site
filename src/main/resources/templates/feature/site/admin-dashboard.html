<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin-layout}">
      
 <head>
    <title>Clients</title>
</head> 
<body>
    <section layout:fragment="content">
    <div class="container-fluid mt-4">
        <h2>Configuration Système</h2>
        <p>Nombre de modules reçus : <span th:text="${users != null ? users.size() : 'LISTE NULL'}">0</span></p>  

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" 
                        hx-get="/admin/users/" 
                        hx-target="#admin-tab-content"
                        data-bs-toggle="tab" data-bs-target="#admin-tab-content">
                    👥 Utilisateurs
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" 
                        hx-get="/admin/role/" 
                        hx-target="#admin-tab-content"
                        data-bs-toggle="tab" data-bs-target="#admin-tab-content">
                    🔑 Rôles
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" 
                        data-bs-toggle="tab" data-bs-target="#admin-tab-content">
                    ⚙️ Paramètres (À venir)
                </button>
            </li>
        </ul>

        <div class="tab-content card shadow">
            <div class="tab-pane fade show active p-4" id="admin-tab-content">
                <div th:replace="~{feature/user/user-table::user-list}"></div>
            </div>
        </div>
    </div>
</section>
 
</body>
</html>
