<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="billing-fields">

    <!-- FORFAIT -->
    <div th:if="${plan.billingModel == null or plan.billingModel.name() == 'FORFAIT'}"
         class="row g-2 mt-1">
        <div class="col-md-3">
            <label class="form-label small fw-bold">Périodicité</label>
            <select name="defaultPeriod" class="form-select form-select-sm">
                <option value="">— Choisir —</option>
                <option th:each="p : ${periods}"
                        th:value="${p.name()}"
                        th:text="${p.label}"
                        th:selected="${plan.defaultPeriod != null and plan.defaultPeriod.name() == p.name()}">
                </option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-bold">Heures incluses</label>
            <div class="input-group input-group-sm">
                <input type="number" name="defaultIncludedHours" min="0"
                       th:value="${plan.defaultIncludedMinutes != null ? plan.defaultIncludedMinutes / 60 : 0}"
                       class="form-control" style="max-width:60px">
                <span class="input-group-text">h</span>
                <input type="number" name="defaultIncludedMins" min="0" max="59"
                       th:value="${plan.defaultIncludedMinutes != null ? plan.defaultIncludedMinutes % 60 : 0}"
                       class="form-control" style="max-width:60px">
                <span class="input-group-text">min</span>
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-bold">Prix par période</label>
            <div class="input-group input-group-sm">
                <input type="number" name="defaultPricePerPeriod" min="0" step="0.01"
                       th:value="${plan.defaultPricePerPeriod}"
                       class="form-control" placeholder="0.00">
                <span class="input-group-text">€</span>
            </div>
        </div>
    </div>

    <!-- HOURLY -->
    <div th:if="${plan.billingModel != null and plan.billingModel.name() == 'HOURLY'}"
         class="row g-2 mt-1">
        <div class="col-md-4">
            <label class="form-label small fw-bold">Tarif horaire</label>
            <div class="input-group input-group-sm">
                <input type="number" name="defaultHourlyRate" min="0" step="0.01"
                       th:value="${plan.defaultHourlyRate}"
                       class="form-control" placeholder="0.00">
                <span class="input-group-text">€/h</span>
            </div>
        </div>
    </div>

    <!-- PER_UNIT -->
    <div th:if="${plan.billingModel != null and plan.billingModel.name() == 'PER_UNIT'}"
         class="row g-2 mt-1">
        <div class="col-md-3">
            <label class="form-label small fw-bold">Libellé de l'unité</label>
            <input type="text" name="unitLabel"
                   th:value="${plan.unitLabel}"
                   class="form-control form-control-sm"
                   placeholder="ex : poste, domaine">
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-bold">Prix par unité</label>
            <div class="input-group input-group-sm">
                <input type="number" name="defaultUnitPrice" min="0" step="0.01"
                       th:value="${plan.defaultUnitPrice}"
                       class="form-control" placeholder="0.00">
                <span class="input-group-text">€/unité</span>
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-bold">Périodicité</label>
            <select name="defaultPeriod" class="form-select form-select-sm">
                <option value="">— Choisir —</option>
                <option th:each="p : ${periods}"
                        th:value="${p.name()}"
                        th:text="${p.label}"
                        th:selected="${plan.defaultPeriod != null and plan.defaultPeriod.name() == p.name()}">
                </option>
            </select>
        </div>
    </div>

    <!-- PER_USER (par personne) -->
    <div th:if="${plan.billingModel != null and plan.billingModel.name() == 'PER_USER'}"
         class="mt-1">
        <div class="alert alert-info py-2 small mb-2">
            <i class="fas fa-sync-alt me-1"></i>
            Le nombre de personnes sera synchronisé automatiquement avec le module <strong>Contacts / Utilisateurs</strong> (à venir).
        </div>
        <div class="row g-2">
            <div class="col-md-3">
                <label class="form-label small fw-bold">Prix par personne</label>
                <div class="input-group input-group-sm">
                    <input type="number" name="defaultUnitPrice" min="0" step="0.01"
                           th:value="${plan.defaultUnitPrice}"
                           class="form-control" placeholder="0.00">
                    <span class="input-group-text">€/pers.</span>
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Périodicité</label>
                <select name="defaultPeriod" class="form-select form-select-sm">
                    <option value="">— Choisir —</option>
                    <option th:each="p : ${periods}"
                            th:value="${p.name()}"
                            th:text="${p.label}"
                            th:selected="${plan.defaultPeriod != null and plan.defaultPeriod.name() == p.name()}">
                    </option>
                </select>
            </div>
        </div>
    </div>

    <!-- PER_DEVICE (par PC / appareil) -->
    <div th:if="${plan.billingModel != null and plan.billingModel.name() == 'PER_DEVICE'}"
         class="mt-1">
        <div class="alert alert-warning py-2 small mb-2">
            <i class="fas fa-sync-alt me-1"></i>
            Le nombre d'appareils sera synchronisé automatiquement avec le module <strong>RMM / Gestion des postes</strong> (à venir).
        </div>
        <div class="row g-2">
            <div class="col-md-3">
                <label class="form-label small fw-bold">Prix par appareil</label>
                <div class="input-group input-group-sm">
                    <input type="number" name="defaultUnitPrice" min="0" step="0.01"
                           th:value="${plan.defaultUnitPrice}"
                           class="form-control" placeholder="0.00">
                    <span class="input-group-text">€/PC</span>
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Périodicité</label>
                <select name="defaultPeriod" class="form-select form-select-sm">
                    <option value="">— Choisir —</option>
                    <option th:each="p : ${periods}"
                            th:value="${p.name()}"
                            th:text="${p.label}"
                            th:selected="${plan.defaultPeriod != null and plan.defaultPeriod.name() == p.name()}">
                    </option>
                </select>
            </div>
        </div>
    </div>

</div>

</body>
</html>
