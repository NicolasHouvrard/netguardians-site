<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Écriture comptable</title></head>
<body>
<div layout:fragment="content">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex align-items-start justify-content-between mb-4">
        <div>
            <h4 class="mb-1">
                <i class="fas fa-file-invoice me-2 text-primary"></i>
                <span th:text="${entry.reference}"></span>
                <span th:if="${entry.locked}" class="badge bg-warning text-dark ms-2 fs-6">
                    <i class="fas fa-lock me-1"></i>Verrouillé
                </span>
            </h4>
            <div class="text-muted small">
                <span th:text="${#temporals.format(entry.entryDate, 'dd MMMM yyyy', new java.util.Locale('fr'))}"></span>
                &bull;
                Journal : <strong th:text="${entry.journal.code} + ' — ' + ${entry.journal.label}"></strong>
                <span th:if="${entry.description}">
                    &bull; <span th:text="${entry.description}"></span>
                </span>
            </div>
        </div>
        <a href="/intra/accounting/entries" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
    </div>

    <!-- Lines table -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width:100px">N° compte</th>
                        <th style="width:200px">Compte</th>
                        <th>Libellé</th>
                        <th class="text-end" style="width:130px">Débit</th>
                        <th class="text-end" style="width:130px">Crédit</th>
                        <th style="width:80px">Lettrage</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="line : ${entry.lines}">
                        <td class="font-monospace fw-semibold" th:text="${line.account.number}"></td>
                        <td class="text-muted small" th:text="${line.account.label}"></td>
                        <td th:text="${line.label}"></td>
                        <td class="text-end font-monospace"
                            th:text="${line.debit.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? ${#numbers.formatDecimal(line.debit, 1, 'COMMA', 2, 'POINT')} : ''">
                        </td>
                        <td class="text-end font-monospace"
                            th:text="${line.credit.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? ${#numbers.formatDecimal(line.credit, 1, 'COMMA', 2, 'POINT')} : ''">
                        </td>
                        <td class="text-muted small" th:text="${line.lettrage}"></td>
                    </tr>
                </tbody>
                <tfoot class="table-light fw-bold">
                    <tr th:with="
                        totalD=${#aggregates.sum(entry.lines.![debit])},
                        totalC=${#aggregates.sum(entry.lines.![credit])}">
                        <td colspan="3" class="text-end">Totaux</td>
                        <td class="text-end font-monospace" th:text="${#numbers.formatDecimal(totalD, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-end font-monospace" th:text="${#numbers.formatDecimal(totalC, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Actions -->
    <div class="d-flex gap-2">
        <form th:unless="${entry.locked}"
              th:action="'/intra/accounting/entries/' + ${entry.id} + '/lock'"
              method="post" class="d-inline">
            <button type="submit" class="btn btn-warning btn-sm">
                <i class="fas fa-lock me-1"></i>Verrouiller
            </button>
        </form>
        <form th:unless="${entry.locked}"
              th:action="'/intra/accounting/entries/' + ${entry.id} + '/delete'"
              method="post" class="d-inline"
              onsubmit="return confirm('Supprimer définitivement cette écriture ?')">
            <button type="submit" class="btn btn-danger btn-sm">
                <i class="fas fa-trash me-1"></i>Supprimer
            </button>
        </form>
        <a href="/intra/accounting/entries" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour à la liste
        </a>
    </div>

</div>
</body>
</html>
