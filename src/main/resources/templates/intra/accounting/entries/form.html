<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Nouvelle écriture comptable</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0"><i class="fas fa-pen-to-square me-2 text-primary"></i>Nouvelle écriture comptable</h4>
        <a href="/intra/accounting/entries" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form action="/intra/accounting/entries/save" method="post" id="entryForm">

        <!-- Header fields -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-light fw-semibold">
                <i class="fas fa-info-circle me-2"></i>En-tête de l'écriture
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-sm-3">
                        <label class="form-label fw-semibold">Journal <span class="text-danger">*</span></label>
                        <select name="journalId" class="form-select" required>
                            <option value="">— Sélectionner —</option>
                            <option th:each="j : ${journals}"
                                    th:value="${j.id}"
                                    th:text="${j.code} + ' — ' + ${j.label}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-3">
                        <label class="form-label fw-semibold">Exercice <span class="text-danger">*</span></label>
                        <select name="fiscalYearId" class="form-select" required>
                            <option value="">— Sélectionner —</option>
                            <option th:each="y : ${fiscalYears}"
                                    th:value="${y.id}"
                                    th:text="${y.label}"
                                    th:disabled="${y.closed}"
                                    th:selected="${currentYear != null and currentYear.id == y.id}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-3">
                        <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                        <input type="date" name="entryDate" class="form-control" required
                               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-sm-3">
                        <label class="form-label fw-semibold">Description</label>
                        <input type="text" name="description" class="form-control"
                               placeholder="Libellé général de l'écriture">
                    </div>
                </div>
            </div>
        </div>

        <!-- Lines -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-header bg-light d-flex align-items-center justify-content-between">
                <span class="fw-semibold"><i class="fas fa-table me-2"></i>Lignes d'écriture</span>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="addLine()">
                    <i class="fas fa-plus me-1"></i>Ajouter une ligne
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="min-width:260px">Compte</th>
                            <th>Libellé</th>
                            <th class="text-end" style="width:130px">Débit</th>
                            <th class="text-end" style="width:130px">Crédit</th>
                            <th style="width:50px"></th>
                        </tr>
                    </thead>
                    <tbody id="linesTbody"></tbody>
                    <tfoot class="table-light fw-semibold">
                        <tr>
                            <td colspan="2" class="text-end">Totaux</td>
                            <td class="text-end font-monospace" id="totalDebit">0.00</td>
                            <td class="text-end font-monospace" id="totalCredit">0.00</td>
                            <td></td>
                        </tr>
                        <tr>
                            <td colspan="5" class="p-1">
                                <div id="balanceStatus" class="alert alert-warning py-1 mb-0 small">
                                    &#9888; Déséquilibre : 0.00 €
                                </div>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Hidden input -->
        <input type="hidden" name="linesJson" id="linesJson" value="[]">

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="btnSubmit" disabled>
                <i class="fas fa-save me-1"></i>Enregistrer l'écriture
            </button>
            <a href="/intra/accounting/entries" class="btn btn-secondary">Annuler</a>
        </div>

    </form>

    <!-- Accounts data -->
    <script th:inline="javascript">
    /*<![CDATA[*/
    const ACCOUNTS = [];
    /*]]>*/
    </script>
    <script th:each="a : ${accounts}" th:inline="javascript">
    /*<![CDATA[*/
    ACCOUNTS.push({ id: /*[[${a.id}]]*/ 0, number: /*[[${a.number}]]*/ '', label: /*[[${a.label}]]*/ '' });
    /*]]>*/
    </script>

    <script>
    let lines = [];

    function addLine() {
        lines.push({ accountId: '', label: '', debit: 0, credit: 0 });
        renderLines();
    }

    function removeLine(idx) {
        lines.splice(idx, 1);
        renderLines();
        updateTotals();
    }

    function renderLines() {
        const tbody = document.getElementById('linesTbody');
        tbody.innerHTML = lines.map((l, i) => {
            const opts = ACCOUNTS.map(a =>
                `<option value="${a.id}" ${String(l.accountId) === String(a.id) ? 'selected' : ''}>${escHtml(a.number)} — ${escHtml(a.label)}</option>`
            ).join('');
            return `<tr>
                <td style="min-width:260px">
                    <select class="form-select form-select-sm" onchange="lines[${i}].accountId=this.value;updateTotals()">
                        <option value="">— Compte —</option>${opts}
                    </select>
                </td>
                <td><input type="text" class="form-control form-control-sm" value="${escHtml(l.label)}"
                    oninput="lines[${i}].label=this.value"></td>
                <td style="width:130px"><input type="number" step="0.01" min="0" class="form-control form-control-sm text-end"
                    value="${l.debit || ''}"
                    oninput="lines[${i}].debit=parseFloat(this.value)||0;lines[${i}].credit=0;this.closest('tr').querySelector('.c-credit').value='';updateTotals()"></td>
                <td style="width:130px"><input type="number" step="0.01" min="0" class="form-control form-control-sm text-end c-credit"
                    value="${l.credit || ''}"
                    oninput="lines[${i}].credit=parseFloat(this.value)||0;lines[${i}].debit=0;this.closest('tr').querySelectorAll('input[type=number]')[0].value='';updateTotals()"></td>
                <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLine(${i})"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        }).join('');
        updateTotals();
    }

    function updateTotals() {
        const td = lines.reduce((s, l) => s + (parseFloat(l.debit) || 0), 0);
        const tc = lines.reduce((s, l) => s + (parseFloat(l.credit) || 0), 0);
        document.getElementById('totalDebit').textContent  = td.toFixed(2);
        document.getElementById('totalCredit').textContent = tc.toFixed(2);
        const diff = Math.abs(td - tc);
        const balanced = diff < 0.005 && lines.length >= 2 && lines.every(l => l.accountId);
        const status = document.getElementById('balanceStatus');
        status.className = 'alert ' + (balanced ? 'alert-success' : 'alert-warning') + ' py-1 mb-0 small';
        status.textContent = balanced
            ? '✓ Écriture équilibrée'
            : '⚠ Déséquilibre : ' + diff.toFixed(2) + ' €';
        document.getElementById('btnSubmit').disabled = !balanced;
        document.getElementById('linesJson').value = JSON.stringify(lines);
    }

    function escHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Init with 2 default lines
    addLine();
    addLine();
    </script>

</div>
</body>
</html>
