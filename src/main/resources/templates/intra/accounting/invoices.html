<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Toutes les factures</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="mb-0"><i class="fas fa-file-invoice-dollar me-2 text-primary"></i>Toutes les factures</h4>
            <div class="text-muted small mt-1">Ventes et achats confondus</div>
        </div>
        <a href="/intra/accounting" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-chart-bar me-1"></i>Tableau de bord
        </a>
    </div>

    <!-- Filtres rapides -->
    <div class="d-flex gap-2 mb-4 flex-wrap">
        <span class="badge text-bg-light border fs-6 px-3 py-2">Toutes</span>
        <span class="badge text-bg-success border fs-6 px-3 py-2">Ventes</span>
        <span class="badge text-bg-info border fs-6 px-3 py-2">Achats</span>
    </div>

    <!-- Liste factures -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(invoices)}" class="text-center py-5 text-muted">
                <i class="fas fa-file-invoice fa-2x mb-3 d-block"></i>Aucune facture.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(invoices)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>N° facture</th>
                        <th>Type</th>
                        <th>Tiers</th>
                        <th>Date</th>
                        <th>Échéance</th>
                        <th>HT</th>
                        <th>TTC</th>
                        <th>Statut</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${invoices != null ? invoices : T(java.util.Collections).emptyList()}"
                        style="cursor:pointer" th:onclick="|window.location='/intra/invoices/${inv.id}'|">
                        <td class="fw-semibold">
                            <a th:href="@{/intra/invoices/{id}(id=${inv.id})}" class="text-decoration-none"
                               th:text="${inv.invoiceNumber}"></a>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${inv.type.name() == 'SALE' ? 'text-bg-success' : 'text-bg-info'}"
                                  th:text="${inv.type.name() == 'SALE' ? 'Vente' : 'Achat'}"></span>
                        </td>
                        <td th:text="${inv.customer != null ? inv.customer.companyName : '-'}"></td>
                        <td th:text="${inv.invoiceDate != null ? #temporals.format(inv.invoiceDate, 'dd/MM/yyyy') : '-'}"></td>
                        <td th:text="${inv.dueDate != null ? #temporals.format(inv.dueDate, 'dd/MM/yyyy') : '-'}"></td>
                        <td th:text="${inv.totalHT != null ? #numbers.formatDecimal(inv.totalHT, 1, 2) + ' €' : '-'}"></td>
                        <td class="fw-semibold" th:text="${inv.totalTTC != null ? #numbers.formatDecimal(inv.totalTTC, 1, 2) + ' €' : '-'}"></td>
                        <td>
                            <span class="badge" th:classappend="${inv.status != null ? inv.status.badgeCss : ''}" th:text="${inv.status}"></span>
                        </td>
                        <td>
                            <form th:action="@{/intra/accounting/invoices/{id}/status(id=${inv.id})}" method="post" class="d-flex gap-1">
                                <select name="status" class="form-select form-select-sm" style="width:auto">
                                    <option th:each="s : ${T(com.logicielpourtous.site.features.invoice.Invoice.InvoiceStatus).values()}"
                                            th:value="${s}" th:text="${s}" th:selected="${s.name() == inv.status.name()}"></option>
                                </select>
                                <button class="btn btn-sm btn-outline-secondary">OK</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Flash message -->
    <div th:if="${successMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div class="toast show text-bg-success">
            <div class="toast-body" th:text="${successMessage}"></div>
        </div>
    </div>

</div>
</body>
</html>
