<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Plan comptable</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0"><i class="fas fa-list-ol me-2 text-primary"></i>Plan comptable général</h4>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAccount">
            <i class="fas fa-plus me-1"></i>Nouveau compte
        </button>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search filter -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-2">
            <input type="text" id="searchInput" class="form-control form-control-sm"
                   placeholder="Filtrer par numéro ou libellé..." oninput="filterAccounts()">
        </div>
    </div>

    <!-- Accounts grouped by class -->
    <div th:each="entry : ${accountsByClass}">
        <h6 class="text-muted text-uppercase fw-bold small mt-4 mb-2"
            th:text="${entry.key == 0 ? 'Autres' : 'Classe ' + entry.key}">Classe</h6>
        <div class="card border-0 shadow-sm mb-3">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0 account-table">
                    <thead class="table-light">
                        <tr>
                            <th style="width:110px">Numéro</th>
                            <th>Libellé</th>
                            <th class="text-center" style="width:100px">Imputable</th>
                            <th class="text-center" style="width:100px">Actif</th>
                            <th class="text-center" style="width:80px">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="acc : ${entry.value}"
                            th:classappend="${!acc.active} ? 'text-muted opacity-50'"
                            class="account-row">
                            <td class="fw-mono fw-semibold" th:text="${acc.number}" data-search></td>
                            <td th:text="${acc.label}" data-search></td>
                            <td class="text-center">
                                <span th:if="${acc.postable}" class="badge bg-success-subtle text-success">Oui</span>
                                <span th:unless="${acc.postable}" class="badge bg-secondary-subtle text-secondary">Non</span>
                            </td>
                            <td class="text-center">
                                <span th:if="${acc.active}" class="badge bg-primary-subtle text-primary">Actif</span>
                                <span th:unless="${acc.active}" class="badge bg-danger-subtle text-danger">Inactif</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <button type="button"
                                            class="btn btn-outline-primary py-0 px-1"
                                            title="Modifier"
                                            th:data-id="${acc.id}"
                                            th:data-number="${acc.number}"
                                            th:data-label="${acc.label}"
                                            th:data-postable="${acc.postable}"
                                            th:data-active="${acc.active}"
                                            onclick="openEdit(this)">
                                        <i class="fas fa-pen"></i>
                                    </button>
                                    <form th:action="'/intra/accounting/plan/' + ${acc.id} + '/toggle'"
                                          method="post" class="d-inline">
                                        <button type="submit"
                                                th:title="${acc.active} ? 'Désactiver' : 'Activer'"
                                                class="btn btn-sm btn-outline-secondary py-0 px-1">
                                            <i th:class="${acc.active} ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${accounts.isEmpty()}" class="text-center text-muted py-5">
        <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
        Aucun compte comptable. Commencez par en créer un.
    </div>

    <!-- Modal: New / Edit account -->
    <div class="modal fade" id="modalAccount" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/intra/accounting/plan/save" method="post">
                    <input type="hidden" name="id" id="modalId">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle"><i class="fas fa-plus-circle me-2"></i>Nouveau compte</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Numéro <span class="text-danger">*</span></label>
                            <input type="text" name="number" id="modalNumber" class="form-control" required
                                   placeholder="Ex: 411000" maxlength="10">
                            <div class="form-text">Le premier chiffre détermine la classe (1–8).</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Libellé <span class="text-danger">*</span></label>
                            <input type="text" name="label" id="modalLabel" class="form-control" required
                                   placeholder="Ex: Clients">
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="postable" id="chkPostable" value="true" checked>
                            <label class="form-check-label" for="chkPostable">Compte imputable (saisie d'écritures)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="active" id="chkActive" value="true" checked>
                            <label class="form-check-label" for="chkActive">Compte actif</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-save me-1"></i>Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    function filterAccounts() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.account-row').forEach(row => {
            const texts = Array.from(row.querySelectorAll('td')).map(td => td.textContent.toLowerCase()).join(' ');
            row.style.display = texts.includes(q) ? '' : 'none';
        });
    }

    function openEdit(btn) {
        document.getElementById('modalId').value    = btn.dataset.id;
        document.getElementById('modalNumber').value = btn.dataset.number;
        document.getElementById('modalLabel').value  = btn.dataset.label;
        document.getElementById('chkPostable').checked = btn.dataset.postable === 'true';
        document.getElementById('chkActive').checked   = btn.dataset.active === 'true';
        document.getElementById('modalTitle').innerHTML =
            '<i class="fas fa-pen me-2"></i>Modifier le compte ' + btn.dataset.number;
        new bootstrap.Modal(document.getElementById('modalAccount')).show();
    }

    document.getElementById('modalAccount').addEventListener('hidden.bs.modal', function () {
        document.getElementById('modalId').value     = '';
        document.getElementById('modalNumber').value = '';
        document.getElementById('modalLabel').value  = '';
        document.getElementById('chkPostable').checked = true;
        document.getElementById('chkActive').checked   = true;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle me-2"></i>Nouveau compte';
    });
    </script>

</div>
</body>
</html>
