<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Bilan</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0"><i class="fas fa-scale-balanced me-2 text-primary"></i>Bilan</h4>
        <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-print me-1"></i>Imprimer
        </button>
    </div>

    <!-- Sélecteur d'exercice -->
    <form method="get" action="/intra/accounting/reports/bilan" class="card border-0 shadow-sm mb-4">
        <div class="card-body py-2">
            <div class="row g-2 align-items-end">
                <div class="col-sm-4">
                    <label class="form-label small fw-semibold mb-1">Exercice fiscal</label>
                    <select name="yearId" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option th:each="y : ${fiscalYears}"
                                th:value="${y.id}"
                                th:text="${y.label} + (${y.current} ? ' (courant)' : '') + (${y.closed} ? ' [clôturé]' : '')"
                                th:selected="${year != null and year.id == y.id}">
                        </option>
                    </select>
                </div>
            </div>
        </div>
    </form>

    <!-- En-tête exercice -->
    <div th:if="${year != null}" class="mb-4 text-muted small">
        <i class="fas fa-calendar me-1"></i>
        <strong th:text="${year.label}"></strong>
        au <span th:text="${#temporals.format(year.endDate, 'dd/MM/yyyy')}"></span>
    </div>

    <div class="row g-4">

        <!-- ── ACTIF ─────────────────────────────────────────────────────── -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-primary text-white border-0">
                    <h6 class="mb-0 fw-bold"><i class="fas fa-arrow-right me-2"></i>ACTIF</h6>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:80px">N°</th>
                                <th>Intitulé</th>
                                <th class="text-end" style="width:130px">Montant (€)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <th:block th:each="section : ${bilan.actif()}">
                                <tr class="table-secondary">
                                    <td colspan="3" class="fw-semibold small text-uppercase"
                                        th:text="${section.title()}"></td>
                                </tr>
                                <tr th:each="line : ${section.lines()}">
                                    <td class="font-monospace text-muted small" th:text="${line.number()}"></td>
                                    <td th:text="${line.label()}"
                                        th:classappend="${line.amount().signum() < 0} ? 'text-danger fst-italic' : ''"></td>
                                    <td class="text-end font-monospace"
                                        th:classappend="${line.amount().signum() < 0} ? 'text-danger' : ''"
                                        th:text="${#numbers.formatDecimal(line.amount(), 1, 'COMMA', 2, 'POINT')}"></td>
                                </tr>
                                <tr class="fw-semibold border-top">
                                    <td colspan="2" class="text-end small">
                                        Total <span th:text="${section.title()}"></span>
                                    </td>
                                    <td class="text-end font-monospace text-primary"
                                        th:text="${#numbers.formatDecimal(section.total(), 1, 'COMMA', 2, 'POINT')}"></td>
                                </tr>
                            </th:block>
                        </tbody>
                        <tfoot class="table-primary fw-bold">
                            <tr>
                                <td colspan="2">TOTAL ACTIF</td>
                                <td class="text-end font-monospace fs-6"
                                    th:text="${#numbers.formatDecimal(bilan.totalActif(), 1, 'COMMA', 2, 'POINT')} + ' €'"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <!-- ── PASSIF ────────────────────────────────────────────────────── -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-success text-white border-0">
                    <h6 class="mb-0 fw-bold"><i class="fas fa-arrow-left me-2"></i>PASSIF</h6>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:80px">N°</th>
                                <th>Intitulé</th>
                                <th class="text-end" style="width:130px">Montant (€)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <th:block th:each="section : ${bilan.passif()}">
                                <tr class="table-secondary">
                                    <td colspan="3" class="fw-semibold small text-uppercase"
                                        th:text="${section.title()}"></td>
                                </tr>
                                <tr th:each="line : ${section.lines()}">
                                    <td class="font-monospace text-muted small" th:text="${line.number()}"></td>
                                    <td th:text="${line.label()}"></td>
                                    <td class="text-end font-monospace"
                                        th:text="${#numbers.formatDecimal(line.amount(), 1, 'COMMA', 2, 'POINT')}"></td>
                                </tr>
                                <tr class="fw-semibold border-top">
                                    <td colspan="2" class="text-end small">
                                        Total <span th:text="${section.title()}"></span>
                                    </td>
                                    <td class="text-end font-monospace text-success"
                                        th:text="${#numbers.formatDecimal(section.total(), 1, 'COMMA', 2, 'POINT')}"></td>
                                </tr>
                            </th:block>
                        </tbody>
                        <tfoot class="table-success fw-bold">
                            <tr>
                                <td colspan="2">TOTAL PASSIF</td>
                                <td class="text-end font-monospace fs-6"
                                    th:text="${#numbers.formatDecimal(bilan.totalPassif(), 1, 'COMMA', 2, 'POINT')} + ' €'"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Contrôle d'équilibre -->
    <div class="mt-4 card border-0 shadow-sm">
        <div class="card-body py-2">
            <div th:with="diff=${bilan.totalActif().subtract(bilan.totalPassif())}">
                <div th:if="${diff.signum() == 0}" class="d-flex align-items-center gap-2 text-success">
                    <i class="fas fa-check-circle fa-lg"></i>
                    <span class="fw-semibold">Bilan équilibré — Actif = Passif =
                        <span th:text="${#numbers.formatDecimal(bilan.totalActif(), 1, 'COMMA', 2, 'POINT')} + ' €'"></span>
                    </span>
                </div>
                <div th:unless="${diff.signum() == 0}" class="d-flex align-items-center gap-2 text-warning">
                    <i class="fas fa-exclamation-triangle fa-lg"></i>
                    <span class="fw-semibold">Bilan déséquilibré — Écart :
                        <span th:text="${#numbers.formatDecimal(diff.abs(), 1, 'COMMA', 2, 'POINT')} + ' €'"></span>
                        (vérifiez les comptes de résultat 120/129)
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${bilan.actif().isEmpty() and bilan.passif().isEmpty()}"
         class="text-center text-muted py-5">
        <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
        Aucune écriture comptable pour cet exercice.
    </div>

</div>
</body>
</html>
