<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Blog</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="mb-0"><i class="fas fa-newspaper me-2 text-warning"></i>Blog</h4>
            <div class="text-muted small mt-1">Rédaction et publication d'articles</div>
        </div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAddPost">
            <i class="fas fa-plus me-1"></i>Nouvel article
        </button>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
                        <i class="fas fa-pen text-secondary fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${drafts}">0</div>
                        <div class="text-muted small">Brouillons</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-success bg-opacity-10 p-3">
                        <i class="fas fa-globe text-success fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${published}">0</div>
                        <div class="text-muted small">Publiés</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste articles -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3 pb-2">
            <h6 class="fw-bold mb-0"><i class="fas fa-list me-2 text-warning"></i>Articles</h6>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(posts)}" class="text-center py-5 text-muted">
                <i class="fas fa-newspaper fa-2x mb-3 d-block"></i>Aucun article.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(posts)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Titre</th>
                        <th>Catégorie</th>
                        <th>Statut</th>
                        <th>Vues</th>
                        <th>Publié le</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${posts != null ? posts : T(java.util.Collections).emptyList()}">
                        <td>
                            <div class="fw-semibold" th:text="${p.title}"></div>
                            <div class="text-muted small" th:text="${p.excerpt}"></div>
                        </td>
                        <td class="text-muted small" th:text="${p.category ?: '-'}"></td>
                        <td>
                            <span class="badge" th:classappend="${p.status.badgeCss}" th:text="${p.status}"></span>
                        </td>
                        <td th:text="${p.viewCount}"></td>
                        <td th:text="${p.publishedAt != null ? #temporals.format(p.publishedAt, 'dd/MM/yyyy') : '-'}"></td>
                        <td>
                            <form th:if="${p.status.name() != 'PUBLISHED'}"
                                  th:action="@{/intra/blog/{id}/publish(id=${p.id})}" method="post">
                                <button class="btn btn-sm btn-outline-success">
                                    <i class="fas fa-globe me-1"></i>Publier
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nouvel article -->
    <div class="modal fade" id="modalAddPost" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form action="/intra/blog" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Nouvel article</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Catégorie</label>
                            <input type="text" name="category" class="form-control" placeholder="Actualités, Conseils...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Résumé</label>
                            <textarea name="excerpt" class="form-control" rows="2"
                                      placeholder="Courte description affichée en liste..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contenu</label>
                            <textarea name="content" class="form-control" rows="8"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">Créer en brouillon</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Flash message -->
    <div th:if="${successMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div class="toast show text-bg-success">
            <div class="toast-body" th:text="${successMessage}"></div>
        </div>
    </div>

</div>
</body>
</html>
