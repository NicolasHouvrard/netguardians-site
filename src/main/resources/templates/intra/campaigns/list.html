<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Campagnes email</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="mb-0"><i class="fas fa-envelope me-2 text-warning"></i>Campagnes email</h4>
            <div class="text-muted small mt-1">Création et envoi de campagnes marketing</div>
        </div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAddCampaign">
            <i class="fas fa-plus me-1"></i>Nouvelle campagne
        </button>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-sm-4 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
                        <i class="fas fa-pen text-secondary fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${drafts}">0</div>
                        <div class="text-muted small">Brouillons</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-4 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-info bg-opacity-10 p-3">
                        <i class="fas fa-clock text-info fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${scheduled}">0</div>
                        <div class="text-muted small">Planifiées</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-4 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-success bg-opacity-10 p-3">
                        <i class="fas fa-check text-success fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${sent}">0</div>
                        <div class="text-muted small">Envoyées</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste campagnes -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3 pb-2">
            <h6 class="fw-bold mb-0"><i class="fas fa-list me-2 text-warning"></i>Mes campagnes</h6>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(campaigns)}" class="text-center py-5 text-muted">
                <i class="fas fa-envelope fa-2x mb-3 d-block"></i>Aucune campagne.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(campaigns)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nom</th>
                        <th>Objet</th>
                        <th>Statut</th>
                        <th>Destinataires</th>
                        <th>Créée le</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${campaigns != null ? campaigns : T(java.util.Collections).emptyList()}">
                        <td class="fw-semibold" th:text="${c.name}"></td>
                        <td class="text-muted" th:text="${c.subject}"></td>
                        <td>
                            <span class="badge" th:classappend="${c.status.badgeCss}" th:text="${c.status}"></span>
                        </td>
                        <td th:text="${c.recipientCount ?: 0}"></td>
                        <td th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nouvelle campagne -->
    <div class="modal fade" id="modalAddCampaign" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form action="/intra/campaigns" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Nouvelle campagne</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nom de la campagne <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required placeholder="Campagne printemps 2026">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Objet de l'email <span class="text-danger">*</span></label>
                            <input type="text" name="subject" class="form-control" required placeholder="Découvrez nos nouveautés !">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contenu HTML</label>
                            <textarea name="htmlContent" class="form-control font-monospace" rows="6"
                                      placeholder="&lt;h1&gt;Bonjour&lt;/h1&gt;..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">Créer en brouillon</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Flash message -->
    <div th:if="${successMessage}" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div class="toast show text-bg-success">
            <div class="toast-body" th:text="${successMessage}"></div>
        </div>
    </div>

</div>
</body>
</html>
