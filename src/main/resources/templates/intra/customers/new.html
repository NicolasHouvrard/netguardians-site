<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Nouveau contact</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/intra/customers" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h4 class="mb-0"><i class="fas fa-address-book me-2 text-primary"></i>Nouveau contact</h4>
    </div>

    <div class="card border-0 shadow-sm" style="max-width:720px">
        <div class="card-body">

            <!-- Toggle Prospect / Client -->
            <div class="mb-4">
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="_typeToggle" id="toggleProspect" checked>
                    <label class="btn btn-outline-warning" for="toggleProspect">
                        <i class="fas fa-user-clock me-1"></i>Prospect
                        <small class="d-block fw-normal" style="font-size:.75rem">Sans accès portail, suivi commercial</small>
                    </label>
                    <input type="radio" class="btn-check" name="_typeToggle" id="toggleClient">
                    <label class="btn btn-outline-primary" for="toggleClient">
                        <i class="fas fa-building me-1"></i>Client
                        <small class="d-block fw-normal" style="font-size:.75rem">Accès portail, facturation</small>
                    </label>
                </div>
            </div>

            <div th:if="${prefillEmail != null}" class="alert alert-info border-0 small mb-3 py-2">
                <i class="fas fa-envelope me-2"></i>
                Création depuis le ticket reçu de <strong th:text="${prefillEmail}"></strong>
            </div>

            <form id="contactForm" action="/intra/customers" method="post">
                <input type="hidden" id="typeField" name="type" value="prospect">
                <input th:if="${prefillTicketId != null}" type="hidden" name="ticketId" th:value="${prefillTicketId}">

                <div class="row g-3">
                    <!-- Champs communs -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nom de l'entreprise <span class="text-danger">*</span></label>
                        <input type="text" name="companyName" class="form-control" required autofocus>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Contact principal</label>
                        <input type="text" name="contactName" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control"
                               th:value="${prefillEmail}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Téléphone</label>
                        <input type="tel" name="phone" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Site web</label>
                        <input type="url" name="website" class="form-control" placeholder="https://…">
                    </div>

                    <!-- Section prospect (visible par défaut) -->
                    <div id="prospectFields" class="col-12">
                        <hr class="my-2">
                        <p class="text-muted small mb-3"><i class="fas fa-info-circle me-1"></i>Informations commerciales</p>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Source</label>
                                <select name="prospectSource" class="form-select">
                                    <option value="">— Sélectionner —</option>
                                    <option th:each="s : ${sources}" th:value="${s.name()}" th:text="${s.label}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Équipe commerciale</label>
                                <select name="teamId" id="teamSelectNew" class="form-select"
                                        hx-get="/intra/prospects/team-members"
                                        hx-trigger="change"
                                        hx-target="#commercialSelectNew"
                                        hx-include="[name='teamId']">
                                    <option value="">— Toutes les équipes —</option>
                                    <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Commercial assigné</label>
                                <select name="assignedCommercialId" id="commercialSelectNew" class="form-select">
                                    <option value="">— Aucun —</option>
                                    <option th:each="u : ${commercials}"
                                            th:value="${u.id}"
                                            th:text="${u.fullName}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Valeur estimée (€)</label>
                                <input type="number" name="estimatedValue" class="form-control" step="100" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Date de clôture prévue</label>
                                <input type="date" name="expectedCloseDate" class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Notes</label>
                                <textarea name="prospectNotes" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Boutons -->
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-save me-1"></i><span id="submitLabel">Créer le prospect</span>
                        </button>
                        <a href="/intra/customers" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-3 text-muted small">
        <i class="fas fa-info-circle me-1"></i>
        Vous pourrez compléter les informations légales (SIREN, SIRET, TVA…) depuis la fiche après création.
    </div>

<script>
const toggleProspect = document.getElementById('toggleProspect');
const toggleClient   = document.getElementById('toggleClient');
const typeField      = document.getElementById('typeField');
const prospectFields = document.getElementById('prospectFields');
const submitLabel    = document.getElementById('submitLabel');

function applyToggle() {
    const isProspect = toggleProspect.checked;
    typeField.value = isProspect ? 'prospect' : 'client';
    prospectFields.classList.toggle('d-none', !isProspect);
    submitLabel.textContent = isProspect ? 'Créer le prospect' : 'Créer le client';
}

toggleProspect.addEventListener('change', applyToggle);
toggleClient.addEventListener('change', applyToggle);
</script>

</div>
</body>
</html>
