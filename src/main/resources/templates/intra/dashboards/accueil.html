<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Tableau de bord</title></head>
<body>
<div layout:fragment="content">

    <div class="pt-2">

        <!-- En-tête ─────────────────────────────────────────────────────────── -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0 fw-bold">
                    <i class="fas fa-gauge-high me-2" style="color:#6366f1"></i>Vue d'ensemble
                </h1>
                <small class="text-muted"
                       th:text="${#temporals.format(#temporals.createNow(), 'EEEE d MMMM yyyy', new java.util.Locale('fr'))}"></small>
            </div>
            <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#widgetModal">
                <i class="fas fa-sliders me-1"></i>Personnaliser
            </button>
        </div>

        <!-- Demandes de société connue (administrateurs) -->
        <div sec:authorize="hasRole('ADMIN')" th:if="${demandesSocieteConnueNonTraitees != null}" class="mb-3">
            <a th:href="@{/intra/demandes-societe-connue}" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-building-circle-exclamation me-1"></i>Demandes de société connue
                <span class="badge rounded-pill ms-1"
                      th:classappend="${demandesSocieteConnueNonTraitees > 0} ? 'bg-danger' : 'bg-secondary'"
                      th:attr="data-compteur-demandes=${demandesSocieteConnueNonTraitees}"
                      th:text="${demandesSocieteConnueNonTraitees}">0</span>
            </a>
        </div>

        <!-- Widgets KPI ────────────────────────────────────────────────────── -->
        <div class="row g-3 mb-4">
            <div th:each="w : ${intraWidgets}"
                 class="col-6"
                 th:classappend="${w.hasSubValues()} ? ' col-md-4' : ' col-md-4 col-xl-3'">

                <!-- Widget valeur unique -->
                <a th:unless="${w.hasSubValues()}"
                   th:href="${w.link}" class="card border-0 shadow-sm h-100 text-decoration-none widget-card">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              th:style="'background:' + ${w.color} + '22;width:46px;height:46px'">
                            <i th:class="${w.icon}" th:style="'color:' + ${w.color} + ';font-size:1.1rem'"></i>
                        </span>
                        <div class="overflow-hidden">
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem" th:text="${w.value}">—</div>
                            <div class="text-muted text-truncate" style="font-size:.72rem" th:text="${w.label}"></div>
                        </div>
                    </div>
                </a>

                <!-- Widget multi-valeurs -->
                <a th:if="${w.hasSubValues()}"
                   th:href="${w.link}" class="card border-0 shadow-sm h-100 text-decoration-none widget-card">
                    <div class="card-body py-3">
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                                  th:style="'background:' + ${w.color} + '22;width:32px;height:32px'">
                                <i th:class="${w.icon}" th:style="'color:' + ${w.color} + ';font-size:.85rem'"></i>
                            </span>
                            <span class="fw-semibold text-muted small text-truncate" th:text="${w.label}"></span>
                        </div>
                        <div class="d-flex justify-content-around text-center">
                            <div th:each="sv : ${w.subValues}">
                                <div class="fw-bold lh-1" style="font-size:1.25rem"
                                     th:style="'color:' + ${sv.color} + ';font-size:1.25rem'"
                                     th:text="${sv.value}">—</div>
                                <div class="text-muted mt-1" style="font-size:.65rem" th:text="${sv.label}"></div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Bouton ajout widget -->
            <div th:if="${#lists.size(intraWidgets) lt #lists.size(intraWidgetsAvailable)}"
                 class="col-6 col-md-4 col-xl-3">
                <button class="card border-2 border-dashed border-secondary-subtle bg-transparent w-100 h-100 text-muted"
                        data-bs-toggle="modal" data-bs-target="#widgetModal"
                        style="cursor:pointer;min-height:76px">
                    <i class="fas fa-plus me-1"></i>Ajouter un widget
                </button>
            </div>
        </div>

        <!-- Activité récente ───────────────────────────────────────────────── -->
        <div class="row g-3">

            <!-- Tickets ouverts -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="fw-semibold">
                            <i class="fas fa-ticket me-2" style="color:#ef4444"></i>Tickets ouverts
                        </span>
                        <a href="/intra/tickets" class="btn btn-sm btn-outline-secondary">Voir tout</a>
                    </div>
                    <div th:if="${#lists.isEmpty(recentTickets)}" class="card-body text-center text-muted py-3">
                        <i class="fas fa-check-circle text-success me-1"></i>Aucun ticket ouvert
                    </div>
                    <ul th:unless="${#lists.isEmpty(recentTickets)}" class="list-group list-group-flush">
                        <li th:each="t : ${recentTickets}" class="list-group-item list-group-item-action px-3 py-2">
                            <a th:href="@{/intra/tickets/{id}(id=${t.id})}"
                               class="text-decoration-none text-dark d-flex justify-content-between align-items-start">
                                <div class="overflow-hidden me-2">
                                    <div class="fw-semibold small text-truncate" th:text="${t.title}">Titre</div>
                                    <div class="text-muted" style="font-size:.72rem"
                                         th:text="${t.customer != null ? t.customer.companyName : '—'}"></div>
                                </div>
                                <div class="flex-shrink-0 text-end">
                                    <span class="badge rounded-pill"
                                          th:text="${t.status.label}"
                                          th:classappend="${t.status.name() == 'NEW'} ? ' bg-danger' : ' bg-warning text-dark'"></span>
                                    <div class="text-muted mt-1" style="font-size:.7rem"
                                         th:text="${#temporals.format(t.createdAt, 'dd/MM')}"></div>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Commandes en attente -->
            <div class="col-md-6" sec:authorize="hasAnyRole('ADMIN','USER','COMMERCIAL')">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="fw-semibold">
                            <i class="fas fa-shopping-bag me-2" style="color:#f59e0b"></i>Commandes à valider
                        </span>
                        <a href="/intra/orders" class="btn btn-sm btn-outline-secondary">Voir tout</a>
                    </div>
                    <div th:if="${#lists.isEmpty(pendingOrders)}" class="card-body text-center text-muted py-3">
                        <i class="fas fa-check-circle text-success me-1"></i>Aucune commande en attente
                    </div>
                    <ul th:unless="${#lists.isEmpty(pendingOrders)}" class="list-group list-group-flush">
                        <li th:each="o : ${pendingOrders}" class="list-group-item list-group-item-action px-3 py-2">
                            <a th:href="@{/intra/orders/{id}(id=${o.id})}"
                               class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                                <div class="overflow-hidden me-2">
                                    <div class="fw-semibold small text-truncate"
                                         th:text="${o.customer != null ? o.customer.companyName : 'Client inconnu'}"></div>
                                    <div class="text-muted" style="font-size:.72rem"
                                         th:text="${o.reference ?: '#' + o.id}"></div>
                                </div>
                                <div class="flex-shrink-0">
                                    <span class="badge bg-warning text-dark">À valider</span>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal personnalisation ──────────────────────────────────────────────── -->
    <div class="modal fade" id="widgetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form method="post" th:action="@{/intra/accueil/widgets}">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">
                            <i class="fas fa-sliders me-2 text-primary"></i>Personnaliser mon tableau de bord
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-muted small mb-3">Sélectionnez les indicateurs à afficher sur votre accueil.</p>
                        <div class="row g-2">
                            <div th:each="w : ${intraWidgetsAvailable}" class="col-6 col-md-4">
                                <label class="d-flex align-items-center gap-2 p-3 rounded border widget-check"
                                       th:classappend="${#lists.contains(intraWidgets.![widgetKey], w.widgetKey)} ? ' border-primary bg-primary bg-opacity-10' : ''">
                                    <input type="checkbox" name="widgets" th:value="${w.widgetKey}"
                                           th:checked="${#lists.contains(intraWidgets.![widgetKey], w.widgetKey)}"
                                           class="form-check-input mt-0 flex-shrink-0">
                                    <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                                          th:style="'background:' + ${w.color} + '22;width:32px;height:32px'">
                                        <i th:class="${w.icon}" th:style="'color:' + ${w.color}"></i>
                                    </span>
                                    <span class="small fw-medium" th:text="${w.label}"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="script">
<style>
.widget-card { transition: transform .15s, box-shadow .15s; }
.widget-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.1) !important; }
.widget-check { cursor: pointer; transition: background .15s; }
</style>
</th:block>
</body>
</html>
