<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Dashboard Comptabilité</title></head>
<body>
<div layout:fragment="content">

    <div th:replace="~{intra/nav :: dashboard-subnav(categoryName='Comptabilité')}"></div>

    <div class="pt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0 fw-bold">
                    <i class="fas fa-calculator me-2" style="color:#6366f1"></i>Dashboard Comptabilité
                </h1>
                <small class="text-muted">Factures, paiements et trésorerie</small>
            </div>
            <div class="text-muted small"
                 th:text="${#temporals.format(#temporals.createNow(), 'EEEE d MMMM yyyy', new java.util.Locale('fr'))}"></div>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <a href="/intra/invoices?status=SENT" class="card border-0 shadow-sm h-100 text-decoration-none"
                   style="border-left:4px solid #f59e0b !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#f59e0b20;width:42px;height:42px">
                            <i class="fas fa-file-invoice" style="color:#f59e0b"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem" th:text="${nbFacturesEnvoyees}">—</div>
                            <div class="text-muted" style="font-size:.72rem">Factures envoyées</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="/intra/invoices?status=OVERDUE" class="card border-0 shadow-sm h-100 text-decoration-none"
                   style="border-left:4px solid #ef4444 !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#ef444420;width:42px;height:42px">
                            <i class="fas fa-triangle-exclamation" style="color:#ef4444"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem" th:text="${nbFacturesEnRetard}">—</div>
                            <div class="text-muted" style="font-size:.72rem">En retard</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm h-100" style="border-left:4px solid #10b981 !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#10b98120;width:42px;height:42px">
                            <i class="fas fa-euro-sign" style="color:#10b981"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem"
                                 th:text="${#numbers.formatDecimal(caEncaisse,1,'COMMA',0,'POINT')} + ' €'">—</div>
                            <div class="text-muted" style="font-size:.72rem">CA encaissé</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm h-100" style="border-left:4px solid #ef4444 !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#ef444420;width:42px;height:42px">
                            <i class="fas fa-clock" style="color:#ef4444"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem"
                                 th:text="${#numbers.formatDecimal(montantEnRetard,1,'COMMA',0,'POINT')} + ' €'">—</div>
                            <div class="text-muted" style="font-size:.72rem">Montant en retard</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Factures récentes -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span class="fw-semibold">
                    <i class="fas fa-file-invoice me-2 text-warning"></i>Factures envoyées récentes
                </span>
                <a href="/intra/invoices" class="btn btn-sm btn-outline-secondary">Voir tout</a>
            </div>
            <div th:if="${#lists.isEmpty(recentInvoices)}" class="card-body text-center text-muted py-4">
                <i class="fas fa-check-circle me-1 text-success"></i>Aucune facture en attente
            </div>
            <ul th:unless="${#lists.isEmpty(recentInvoices)}" class="list-group list-group-flush">
                <li th:each="inv : ${recentInvoices}" class="list-group-item list-group-item-action px-3 py-2">
                    <a th:href="@{/intra/invoices/{id}(id=${inv.id})}"
                       class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-semibold small" th:text="${inv.invoiceNumber}">FAC</div>
                            <div class="text-muted" style="font-size:.75rem"
                                 th:text="${inv.customer != null ? inv.customer.companyName : '—'}"></div>
                        </div>
                        <div class="text-end">
                            <div class="fw-semibold small text-primary"
                                 th:text="${#numbers.formatDecimal(inv.totalTTC,1,'COMMA',2,'POINT')} + ' €'"></div>
                            <div class="text-muted" style="font-size:.7rem"
                                 th:text="${#temporals.format(inv.invoiceDate,'dd/MM/yyyy')}"></div>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
