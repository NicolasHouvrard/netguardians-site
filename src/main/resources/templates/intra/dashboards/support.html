<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Dashboard Support</title></head>
<body>
<div layout:fragment="content">

    <div th:replace="~{intra/nav :: dashboard-subnav(categoryName='Support')}"></div>

    <div class="pt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0 fw-bold">
                    <i class="fas fa-headset me-2" style="color:#6366f1"></i>Dashboard Support
                </h1>
                <small class="text-muted">Tickets, interventions et parc informatique</small>
            </div>
            <div class="text-muted small"
                 th:text="${#temporals.format(#temporals.createNow(), 'EEEE d MMMM yyyy', new java.util.Locale('fr'))}"></div>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <a href="/intra/tickets" class="card border-0 shadow-sm h-100 text-decoration-none"
                   style="border-left:4px solid #ef4444 !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#ef444420;width:42px;height:42px">
                            <i class="fas fa-ticket" style="color:#ef4444"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem" th:text="${nbTicketsOuverts}">—</div>
                            <div class="text-muted" style="font-size:.72rem">Tickets ouverts</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="/intra/interventions" class="card border-0 shadow-sm h-100 text-decoration-none"
                   style="border-left:4px solid #f59e0b !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#f59e0b20;width:42px;height:42px">
                            <i class="fas fa-wrench" style="color:#f59e0b"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem" th:text="${nbInterventionsEnCours}">—</div>
                            <div class="text-muted" style="font-size:.72rem">Interventions en cours</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="/intra/devices" class="card border-0 shadow-sm h-100 text-decoration-none"
                   style="border-left:4px solid #3b82f6 !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#3b82f620;width:42px;height:42px">
                            <i class="fas fa-desktop" style="color:#3b82f6"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem">—</div>
                            <div class="text-muted" style="font-size:.72rem">Appareils (NinjaOne)</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="/intra/marketplace" class="card border-0 shadow-sm h-100 text-decoration-none"
                   style="border-left:4px solid #10b981 !important">
                    <div class="card-body d-flex align-items-center gap-3 py-3">
                        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                              style="background:#10b98120;width:42px;height:42px">
                            <i class="fas fa-store" style="color:#10b981"></i>
                        </span>
                        <div>
                            <div class="fw-bold lh-1 mb-1" style="font-size:1.5rem">—</div>
                            <div class="text-muted" style="font-size:.72rem">Marketplace</div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Tickets ouverts récents -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span class="fw-semibold">
                    <i class="fas fa-headset me-2 text-warning"></i>Tickets ouverts récents
                </span>
                <a href="/intra/tickets" class="btn btn-sm btn-outline-secondary">Voir tout</a>
            </div>
            <div th:if="${#lists.isEmpty(recentTickets)}" class="card-body text-center text-muted py-4">
                <i class="fas fa-check-circle me-1 text-success"></i>Aucun ticket ouvert
            </div>
            <ul th:unless="${#lists.isEmpty(recentTickets)}" class="list-group list-group-flush">
                <li th:each="t : ${recentTickets}" class="list-group-item list-group-item-action px-3 py-2">
                    <a th:href="@{/intra/tickets/{id}(id=${t.id})}"
                       class="text-decoration-none text-dark d-flex justify-content-between align-items-start">
                        <div class="overflow-hidden me-2">
                            <div class="fw-semibold text-truncate small" th:text="${t.title}">Titre</div>
                            <div class="text-muted" style="font-size:.75rem"
                                 th:text="${t.customer != null ? t.customer.companyName : '—'}"></div>
                        </div>
                        <div class="flex-shrink-0 text-end">
                            <span class="badge rounded-pill"
                                  th:text="${t.status.label}"
                                  th:classappend="${t.status.name() == 'NEW'} ? ' bg-danger' : ' bg-warning text-dark'"></span>
                            <div class="text-muted mt-1" style="font-size:.7rem"
                                 th:text="${#temporals.format(t.createdAt, 'dd/MM')}"></div>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
