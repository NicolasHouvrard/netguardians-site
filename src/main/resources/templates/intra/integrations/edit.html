<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Modifier intégration</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/intra/integrations(customerId=${integration.customerId})}"
           class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h4 class="mb-0 flex-grow-1">
            <i th:class="${integration.serviceType.icon} + ' me-2'"
               th:style="'color:' + ${integration.serviceType.color}"></i>
            <span th:text="${integration.label}"></span>
        </h4>
        <span th:if="${integration.enabled}"  class="badge text-bg-success">Actif</span>
        <span th:if="${!integration.enabled}" class="badge text-bg-secondary">Inactif</span>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form th:action="@{/intra/integrations/{id}(id=${integration.id})}" method="post">

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Service</label>
                        <input type="text" class="form-control" readonly
                               th:value="${integration.serviceType.label}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Label</label>
                        <input type="text" name="label" class="form-control"
                               th:value="${integration.label}">
                    </div>
                    <div class="col-md-6">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" name="enabled"
                                   id="enabledSwitch" th:checked="${integration.enabled}">
                            <label class="form-check-label" for="enabledSwitch">Intégration active</label>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- Champs NinjaOne -->
                <div th:if="${integration.serviceType.name() == 'NINJA_ONE'}">
                    <p class="fw-semibold small text-warning mb-3"><i class="fas fa-shield-alt me-1"></i>NinjaOne RMM</p>
                    <div class="mb-3">
                        <label class="form-label small">Clé API</label>
                        <input type="password" name="apiKey" class="form-control"
                               th:value="${integration.apiKey}" autocomplete="new-password">
                    </div>
                </div>

                <!-- Champs Microsoft 365 -->
                <div th:if="${integration.serviceType.name() == 'MICROSOFT_365'}">
                    <p class="fw-semibold small mb-3" style="color:#0078d4"><i class="fab fa-microsoft me-1"></i>Microsoft 365</p>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small">Tenant ID</label>
                            <input type="text" name="tenantId" class="form-control font-monospace"
                                   th:value="${integration.tenantId}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Client ID</label>
                            <input type="text" name="clientId" class="form-control font-monospace"
                                   th:value="${integration.clientId}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Client Secret</label>
                            <input type="password" name="clientSecret" class="form-control"
                                   th:value="${integration.clientSecret}" autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <!-- Champs Google Workspace -->
                <div th:if="${integration.serviceType.name() == 'GOOGLE_WORKSPACE'}">
                    <p class="fw-semibold small mb-3" style="color:#4285f4"><i class="fab fa-google me-1"></i>Google Workspace</p>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small">Domaine</label>
                            <input type="text" name="tenantId" class="form-control"
                                   th:value="${integration.tenantId}" placeholder="monentreprise.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Client ID</label>
                            <input type="text" name="clientId" class="form-control"
                                   th:value="${integration.clientId}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Client Secret</label>
                            <input type="password" name="clientSecret" class="form-control"
                                   th:value="${integration.clientSecret}" autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <!-- Champs Slack -->
                <div th:if="${integration.serviceType.name() == 'SLACK'}">
                    <p class="fw-semibold small mb-3" style="color:#4a154b"><i class="fab fa-slack me-1"></i>Slack</p>
                    <div class="mb-3">
                        <label class="form-label small">Webhook URL</label>
                        <input type="url" name="webhookUrl" class="form-control"
                               th:value="${integration.webhookUrl}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Bot Token</label>
                        <input type="password" name="apiKey" class="form-control"
                               th:value="${integration.apiKey}" autocomplete="new-password">
                    </div>
                </div>

                <!-- Champs Custom -->
                <div th:if="${integration.serviceType.name() == 'CUSTOM'}">
                    <p class="fw-semibold small mb-3 text-secondary"><i class="fas fa-cog me-1"></i>Personnalisé</p>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small">Clé / Identifiant</label>
                            <input type="text" name="clientId" class="form-control"
                                   th:value="${integration.clientId}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Secret / Token</label>
                            <input type="password" name="apiKey" class="form-control"
                                   th:value="${integration.apiKey}" autocomplete="new-password">
                        </div>
                        <div class="col-12">
                            <label class="form-label small">URL</label>
                            <input type="url" name="webhookUrl" class="form-control"
                                   th:value="${integration.webhookUrl}">
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label small fw-semibold">Notes</label>
                    <textarea name="notes" class="form-control" rows="3"
                              th:text="${integration.notes}"></textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Enregistrer
                    </button>
                    <form th:action="@{/intra/integrations/{id}/delete(id=${integration.id})}" method="post"
                          onsubmit="return confirm('Supprimer cette intégration ?')">
                        <button type="submit" class="btn btn-outline-danger">
                            <i class="fas fa-trash me-1"></i>Supprimer
                        </button>
                    </form>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
