<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Interventions</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="mb-0"><i class="fas fa-wrench me-2 text-warning"></i>Interventions</h4>
            <div class="text-muted small mt-1">Suivi des interventions techniques sur site et à distance</div>
        </div>
        <div class="d-flex gap-2">
            <a href="/intra/marketplace" class="btn btn-outline-info btn-sm">
                <i class="fas fa-store me-1"></i>Place de marché
            </a>
            <a href="/intra/interventions/billing" class="btn btn-outline-success btn-sm">
                <i class="fas fa-file-invoice me-1"></i>Facturation
            </a>
            <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#modalAddIntervention">
                <i class="fas fa-plus me-1"></i>Nouvelle
            </button>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-warning bg-opacity-10 p-3">
                        <i class="fas fa-spinner text-warning fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${inProgress}">0</div>
                        <div class="text-muted small">En cours</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-info bg-opacity-10 p-3">
                        <i class="fas fa-store text-info fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${published}">0</div>
                        <div class="text-muted small">Sur le marketplace</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-success bg-opacity-10 p-3">
                        <i class="fas fa-check-circle text-success fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${completed}">0</div>
                        <div class="text-muted small">Terminées</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
                        <i class="fas fa-handshake text-secondary fa-lg"></i>
                    </div>
                    <div>
                        <a href="/intra/esns" class="text-decoration-none">
                            <div class="text-muted small">ESN Partenaires</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3 pb-2">
            <h6 class="fw-bold mb-0"><i class="fas fa-list me-2 text-warning"></i>Toutes les interventions</h6>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(interventions)}" class="text-center py-5 text-muted">
                <i class="fas fa-wrench fa-2x mb-3 d-block"></i>Aucune intervention.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(interventions)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Réf.</th>
                        <th>Client</th>
                        <th>Type</th>
                        <th>Assigné à</th>
                        <th>Date</th>
                        <th class="text-end">Montant</th>
                        <th>Statut</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${interventions}">
                        <td>
                            <span class="fw-semibold" th:text="${i.reference ?: i.title}"></span>
                            <div th:if="${i.reference != null}" class="text-muted small" th:text="${i.title}"></div>
                        </td>
                        <td th:text="${i.customer != null ? i.customer.companyName : '—'}"></td>
                        <td>
                            <span class="badge text-bg-secondary" th:text="${i.type.label}"></span>
                            <span th:if="${i.assignmentMode.name() == 'MARKETPLACE'}"
                                  class="badge text-bg-info ms-1">
                                <i class="fas fa-store me-1"></i>Marché
                            </span>
                        </td>
                        <td>
                            <span th:if="${i.technician != null}" th:text="${i.technician.fullName}"></span>
                            <span th:if="${i.partnerEsn != null}" class="text-info"
                                  th:text="${i.partnerEsn.companyName}"></span>
                            <span th:if="${i.technician == null and i.partnerEsn == null}" class="text-muted">—</span>
                        </td>
                        <td th:text="${i.date != null ? #temporals.format(i.date,'dd/MM/yyyy') : '—'}"></td>
                        <td class="text-end">
                            <span th:if="${i.clientAmount != null and i.clientAmount > 0}" class="text-success fw-semibold"
                                  th:text="${#numbers.formatDecimal(i.clientAmount, 1, 2) + ' €'}"></span>
                            <span th:unless="${i.clientAmount != null and i.clientAmount > 0}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${i.status.badgeCss}" th:text="${i.status.label}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/intra/interventions/{id}(id=${i.id})}"
                               class="btn btn-sm btn-outline-warning">
                                <i class="fas fa-eye me-1"></i>Ouvrir
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nouvelle intervention -->
    <div class="modal fade" id="modalAddIntervention" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form action="/intra/interventions" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Nouvelle intervention</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-sm-8">
                                <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" required>
                            </div>
                            <div class="col-sm-4">
                                <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
                                <select name="type" class="form-select" required>
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Client</label>
                                <select name="customerId" class="form-select">
                                    <option value="">— Aucun —</option>
                                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.companyName}"></option>
                                </select>
                            </div>
                            <div class="col-sm-3">
                                <label class="form-label fw-semibold">Date</label>
                                <input type="date" name="date" class="form-control">
                            </div>
                            <div class="col-sm-3">
                                <label class="form-label fw-semibold">Durée est. (min)</label>
                                <input type="number" name="durationMinutes" class="form-control" min="0" placeholder="60">
                            </div>
                            <div class="col-sm-4">
                                <label class="form-label fw-semibold">Ville / Site</label>
                                <input type="text" name="city" class="form-control" placeholder="Paris">
                            </div>
                            <div class="col-sm-4">
                                <label class="form-label fw-semibold">Mode facturation</label>
                                <select name="billingType" class="form-select">
                                    <option th:each="b : ${billingTypes}" th:value="${b}" th:text="${b.label}"></option>
                                </select>
                            </div>
                            <div class="col-sm-4">
                                <label class="form-label fw-semibold">Taux horaire client (€/h)</label>
                                <input type="number" name="hourlyRateClient" class="form-control" step="0.01" min="0" placeholder="0.00">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea name="description" class="form-control" rows="2"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-warning">Créer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
