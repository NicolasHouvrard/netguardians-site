<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Factures clients</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="mb-0"><i class="fas fa-file-invoice me-2 text-success"></i>Factures clients</h4>
            <div class="text-muted small mt-1">Factures de vente émises</div>
        </div>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
                        <i class="fas fa-pen text-secondary fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${draft}">0</div>
                        <div class="text-muted small">Brouillons</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-info bg-opacity-10 p-3">
                        <i class="fas fa-paper-plane text-info fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${sent}">0</div>
                        <div class="text-muted small">Envoyées</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-danger bg-opacity-10 p-3">
                        <i class="fas fa-exclamation-circle text-danger fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${overdue}">0</div>
                        <div class="text-muted small">En retard</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste factures -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3 pb-2 d-flex align-items-center justify-content-between">
            <h6 class="fw-bold mb-0"><i class="fas fa-list me-2 text-success"></i>Factures de vente</h6>
            <a href="/intra/invoices/new" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Nouvelle facture
            </a>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(invoices)}" class="text-center py-5 text-muted">
                <i class="fas fa-file-invoice fa-2x mb-3 d-block"></i>Aucune facture de vente.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(invoices)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>N° facture</th>
                        <th>Client</th>
                        <th>Date</th>
                        <th>Échéance</th>
                        <th>Total TTC</th>
                        <th>Statut</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${invoices != null ? invoices : T(java.util.Collections).emptyList()}">
                        <td>
                            <a th:href="@{/intra/invoices/{id}(id=${inv.id})}" class="fw-semibold text-decoration-none"
                               th:text="${inv.invoiceNumber}"></a>
                        </td>
                        <td th:text="${inv.customer != null ? inv.customer.companyName : '-'}"></td>
                        <td th:text="${inv.invoiceDate != null ? #temporals.format(inv.invoiceDate, 'dd/MM/yyyy') : '-'}"></td>
                        <td th:text="${inv.dueDate != null ? #temporals.format(inv.dueDate, 'dd/MM/yyyy') : '-'}"></td>
                        <td th:text="${inv.totalTTC != null ? #numbers.formatDecimal(inv.totalTTC, 1, 2) + ' €' : '-'}"></td>
                        <td>
                            <span class="badge" th:classappend="${inv.status != null ? inv.status.badgeCss : ''}" th:text="${inv.status != null ? inv.status.label : ''}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
