<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${invoice.invoiceNumber}">Facture</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; font-size: 13px; color: #222; padding: 32px; max-width: 800px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 36px; }
        .sender .company { font-size: 16px; font-weight: bold; }
        .sender .sub { color: #555; font-size: 12px; margin-top: 2px; white-space: pre-line; }
        .invoice-title { text-align: right; }
        .invoice-title h1 { font-size: 26px; font-weight: bold; color: #1a1a2e; margin-bottom: 4px; }
        .invoice-title .meta { font-size: 12px; color: #555; }
        .invoice-title .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 6px; }
        .badge-DRAFT     { background: #e2e8f0; color: #475569; }
        .badge-SENT      { background: #dbeafe; color: #1d4ed8; }
        .badge-PAID      { background: #dcfce7; color: #166534; }
        .badge-OVERDUE   { background: #fee2e2; color: #991b1b; }
        .badge-CANCELLED { background: #f1f5f9; color: #334155; }
        .addresses { display: flex; gap: 32px; margin-bottom: 28px; }
        .address-box { flex: 1; border: 1px solid #e2e8f0; border-radius: 4px; padding: 12px 16px; }
        .address-box .label { font-size: 10px; text-transform: uppercase; color: #94a3b8; letter-spacing: .05em; margin-bottom: 6px; }
        .address-box .name { font-weight: bold; font-size: 14px; }
        .address-box .detail { font-size: 12px; color: #555; margin-top: 3px; white-space: pre-line; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        thead th { background: #1a1a2e; color: #fff; padding: 8px 10px; font-size: 12px; text-align: left; }
        thead th.right { text-align: right; }
        tbody tr:nth-child(even) { background: #f8fafc; }
        tbody td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; font-size: 12px; vertical-align: top; }
        tbody td.right { text-align: right; }
        tbody td.center { text-align: center; }
        .totals { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .totals-box { min-width: 260px; }
        .totals-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
        .totals-row.total { border-top: 2px solid #1a1a2e; margin-top: 6px; padding-top: 8px; font-size: 15px; font-weight: bold; color: #1a1a2e; }
        .vat-summary { margin-bottom: 20px; }
        .vat-summary table thead th { background: #475569; }
        .vat-summary table { font-size: 12px; }
        .mentions { font-size: 11px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 12px; margin-top: 12px; white-space: pre-line; }
        .notes-box { font-size: 12px; color: #555; border-left: 3px solid #e2e8f0; padding-left: 12px; margin-bottom: 20px; white-space: pre-wrap; }
        .footer { margin-top: 32px; font-size: 10px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px; text-align: center; }
        .no-print { margin-bottom: 20px; }
        @media print {
            body { padding: 16px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()" style="padding:7px 18px;cursor:pointer;margin-right:10px;font-size:13px">
        <i>🖨</i> Imprimer / Enregistrer en PDF
    </button>
    <a th:href="@{/intra/invoices/{id}(id=${invoice.id})}">← Retour à la facture</a>
</div>

<!-- En-tête -->
<div class="header">
    <div class="sender">
        <div th:if="${tenant != null}">
            <div class="company" th:text="${tenant.name}"></div>
            <div class="sub" th:if="${tenant.billingAddress != null}" th:text="${tenant.billingAddress}"></div>
            <div class="sub" th:if="${tenant.phone != null}" th:text="${tenant.phone}"></div>
            <div class="sub" th:if="${tenant.email != null}" th:text="${tenant.email}"></div>
            <div class="sub" th:if="${tenant.siren != null}">SIREN : <span th:text="${tenant.siren}"></span></div>
            <div class="sub" th:if="${tenant.vatNumber != null}">TVA : <span th:text="${tenant.vatNumber}"></span></div>
        </div>
    </div>

    <div class="invoice-title">
        <h1>FACTURE</h1>
        <div class="meta">
            N° <strong th:text="${invoice.invoiceNumber}"></strong><br>
            Date : <span th:text="${invoice.invoiceDate != null ? #temporals.format(invoice.invoiceDate,'dd/MM/yyyy') : '—'}"></span><br>
            Échéance : <span th:text="${invoice.dueDate != null ? #temporals.format(invoice.dueDate,'dd/MM/yyyy') : '—'}"></span>
        </div>
        <div th:if="${invoice.status != null}"
             class="badge"
             th:classappend="'badge-' + ${invoice.status.name()}"
             th:text="${invoice.status.label}"></div>
    </div>
</div>

<!-- Adresses -->
<div class="addresses">
    <div class="address-box">
        <div class="label">Émetteur</div>
        <div th:if="${tenant != null}">
            <div class="name" th:text="${tenant.name}"></div>
            <div class="detail" th:if="${tenant.billingAddress != null}" th:text="${tenant.billingAddress}"></div>
        </div>
        <div th:unless="${tenant != null}" class="detail" style="color:#c00">
            <a href="/intra/settings/company">Configurer les infos entreprise</a>
        </div>
    </div>
    <div class="address-box">
        <div class="label">Destinataire</div>
        <div th:if="${invoice.customer != null}">
            <div class="name" th:text="${invoice.customer.companyName}"></div>
            <div class="detail" th:if="${invoice.customer.address != null}" th:text="${invoice.customer.address}"></div>
            <div class="detail" th:if="${invoice.customer.vatNumber != null}">TVA : <span th:text="${invoice.customer.vatNumber}"></span></div>
        </div>
        <div th:unless="${invoice.customer != null}" class="detail">—</div>
    </div>
</div>

<!-- Lignes -->
<table>
    <thead>
    <tr>
        <th>Description</th>
        <th class="right" style="width:55px">Qté</th>
        <th class="right" style="width:100px">P.U. HT</th>
        <th class="right" style="width:70px">TVA</th>
        <th class="right" style="width:110px">Total HT</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${invoice.lines}">
        <td>
            <span th:text="${line.description}"></span>
        </td>
        <td class="center" th:text="${line.quantity}"></td>
        <td class="right" th:text="${line.unitPrice != null ? #numbers.formatDecimal(line.unitPrice,1,2) + ' €' : '—'}"></td>
        <td class="center" th:text="${line.vatRate != null ? #numbers.formatDecimal(line.vatRate,1,2) + ' %' : '—'}"></td>
        <td class="right" th:text="${line.totalHT != null ? #numbers.formatDecimal(line.totalHT,1,2) + ' €' : '—'}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(invoice.lines)}">
        <td colspan="5" style="text-align:center;color:#94a3b8;padding:16px">Aucune ligne</td>
    </tr>
    </tbody>
</table>

<!-- Récapitulatif TVA -->
<div th:if="${vatSummary != null and not #lists.isEmpty(vatSummary)}" class="vat-summary">
    <table style="width:auto;margin-left:auto">
        <thead>
        <tr>
            <th style="width:80px">Taux TVA</th>
            <th class="right" style="width:100px">Base HT</th>
            <th class="right" style="width:90px">TVA</th>
            <th class="right" style="width:100px">TTC</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${vatSummary}">
            <td class="center" th:text="${#numbers.formatDecimal(row['rate'],1,2) + ' %'}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(row['baseHT'],1,2) + ' €'}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(row['tva'],1,2) + ' €'}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(row['ttc'],1,2) + ' €'}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Totaux -->
<div class="totals">
    <div class="totals-box">
        <div class="totals-row">
            <span>Total HT</span>
            <span th:text="${#numbers.formatDecimal(invoice.totalHT != null ? invoice.totalHT : 0, 1, 2) + ' €'}"></span>
        </div>
        <div class="totals-row">
            <span>TVA</span>
            <span th:text="${#numbers.formatDecimal(invoice.totalTVA != null ? invoice.totalTVA : 0, 1, 2) + ' €'}"></span>
        </div>
        <div class="totals-row total">
            <span>Total TTC</span>
            <span th:text="${#numbers.formatDecimal(invoice.totalTTC != null ? invoice.totalTTC : 0, 1, 2) + ' €'}"></span>
        </div>
    </div>
</div>

<!-- Notes -->
<div th:if="${invoice.notes != null and not #strings.isEmpty(invoice.notes)}" class="notes-box">
    <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Notes</div>
    <span th:text="${invoice.notes}"></span>
</div>

<!-- Mention TVA -->
<div th:if="${invoice.vatMention != null and not #strings.isEmpty(invoice.vatMention)}" class="mentions"
     th:text="${invoice.vatMention}"></div>

<div class="footer">
    Document généré le <span th:text="${#temporals.format(#temporals.createNow(),'dd/MM/yyyy HH:mm')}"></span>
    <th:block th:if="${tenant != null and tenant.siren != null}">
        — SIREN <span th:text="${tenant.siren}"></span>
    </th:block>
</div>

</body>
</html>
