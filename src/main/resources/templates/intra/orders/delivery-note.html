<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="'Bon de livraison – ' + ${order.orderNumber}">Bon de livraison</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 13px; color: #222; margin: 0; padding: 20px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #666; font-size: 12px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 32px; }
        .company { font-weight: bold; font-size: 15px; }
        .client-box { border: 1px solid #ccc; padding: 12px 16px; min-width: 200px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th { background: #f0f0f0; text-align: left; padding: 7px 10px; border-bottom: 2px solid #ccc; font-size: 12px; }
        td { padding: 7px 10px; border-bottom: 1px solid #e8e8e8; vertical-align: top; }
        .qty-col { text-align: center; width: 60px; }
        .check-col { text-align: center; width: 80px; }
        .footer { margin-top: 40px; font-size: 11px; color: #888; border-top: 1px solid #ddd; padding-top: 12px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-info { background: #d0eaff; color: #0057a8; }
        @media print {
            body { padding: 0; }
            .no-print { display: none !important; }
            a { text-decoration: none; color: inherit; }
        }
    </style>
</head>
<body>

<div class="no-print" style="margin-bottom:16px">
    <button onclick="window.print()" style="padding:6px 16px;cursor:pointer;margin-right:8px">
        Imprimer / Enregistrer en PDF
    </button>
    <a th:href="@{/intra/orders/{id}(id=${order.id})}">← Retour à la commande</a>
</div>

<div class="header">
    <div>
        <!-- Expéditeur -->
        <div th:if="${tenant != null}">
            <div class="company" th:text="${tenant.name}"></div>
            <div th:if="${tenant.billingAddress != null}" th:text="${tenant.billingAddress}" class="sub" style="white-space:pre-line;margin-top:2px"></div>
            <div th:if="${tenant.phone != null}" class="sub"><i class="fas fa-phone" style="font-size:10px"></i> <span th:text="${tenant.phone}"></span></div>
            <div th:if="${tenant.email != null}" class="sub"><span th:text="${tenant.email}"></span></div>
            <div th:if="${tenant.siren != null}" class="sub" style="margin-top:4px">SIREN : <span th:text="${tenant.siren}"></span></div>
            <div th:if="${tenant.vatNumber != null}" class="sub">TVA : <span th:text="${tenant.vatNumber}"></span></div>
            <div th:if="${tenant.billingAddress == null}" class="no-print" style="margin-top:6px">
                <a href="/intra/settings/company" style="font-size:11px;color:#c00">
                    ⚠ Configurer les informations entreprise
                </a>
            </div>
        </div>
        <div style="margin-top:20px">
            <h1>BON DE LIVRAISON</h1>
            <div class="sub">
                N° <strong th:text="${order.orderNumber}"></strong>
                &nbsp;·&nbsp;
                Date : <span th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd/MM/yyyy') : #temporals.format(#temporals.createToday(), 'dd/MM/yyyy')}"></span>
            </div>
            <div class="sub" th:if="${order.expectedDate != null}">
                Date souhaitée : <span th:text="${#temporals.format(order.expectedDate, 'dd/MM/yyyy')}"></span>
            </div>
        </div>
    </div>

    <div>
        <div class="client-box">
            <div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:4px">Destinataire</div>
            <div class="company" th:text="${order.customer != null ? order.customer.companyName : '—'}"></div>
            <div th:if="${order.customer?.address != null}" th:text="${order.customer.address}" class="sub" style="white-space:pre-line;margin-top:4px"></div>
        </div>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>Description</th>
        <th class="qty-col">Qté</th>
        <th class="check-col">Remis</th>
        <th class="check-col">Signature</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${order.lines}">
        <td th:text="${line.description}"></td>
        <td class="qty-col" th:text="${line.quantity}"></td>
        <td class="check-col">☐</td>
        <td class="check-col"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(order.lines)}">
        <td colspan="4" style="text-align:center;color:#999;padding:20px">Aucune ligne</td>
    </tr>
    </tbody>
</table>

<div style="margin-top:32px;display:flex;gap:40px">
    <div style="flex:1">
        <div style="font-size:11px;color:#888;margin-bottom:8px">Notes / Observations</div>
        <div th:if="${order.notes != null and not #strings.isEmpty(order.notes)}"
             style="white-space:pre-wrap;font-size:12px" th:text="${order.notes}"></div>
        <div th:unless="${order.notes != null and not #strings.isEmpty(order.notes)}"
             style="height:60px;border-bottom:1px solid #ccc"></div>
    </div>
    <div style="flex:1">
        <div style="font-size:11px;color:#888;margin-bottom:8px">Signature du destinataire</div>
        <div style="height:60px;border-bottom:1px solid #ccc"></div>
    </div>
</div>

<div class="footer">
    Bon de livraison généré le <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
</div>

</body>
</html>
