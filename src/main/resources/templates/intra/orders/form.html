<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Nouveau devis</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="${ticket != null ? '/intra/tickets/' + ticket.id : '/intra/orders'}"
           class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h4 class="mb-0"><i class="fas fa-file-signature me-2 text-success"></i>Nouveau devis</h4>
    </div>

    <div th:if="${ticket != null}" class="alert alert-info d-flex align-items-center gap-2 mb-4">
        <i class="fas fa-ticket"></i>
        <span>Lié au ticket <strong th:text="'#' + ${ticket.id} + ' – ' + ${ticket.title}"></strong></span>
    </div>

    <div class="card border-0 shadow-sm" style="max-width:640px">
        <div class="card-body">
            <form th:action="@{/intra/orders}" method="post">
                <input type="hidden" name="ticketId" th:if="${ticket != null}" th:value="${ticket.id}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Client <span class="text-danger">*</span></label>
                    <select name="customerId" class="form-select" required>
                        <option value="">— Choisir un client —</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.companyName}"
                                th:selected="${ticket != null and ticket.customer != null and ticket.customer.id == c.id}">
                        </option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Date du devis</label>
                        <input type="date" name="orderDate" class="form-control"
                               th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Date souhaitée</label>
                        <input type="date" name="expectedDate" class="form-control">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Notes</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="Conditions, remarques..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-plus me-1"></i>Créer le devis
                    </button>
                    <a th:href="${ticket != null ? '/intra/tickets/' + ticket.id : '/intra/orders'}"
                       class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
