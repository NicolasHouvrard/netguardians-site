<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head>
<title>Prospects CRM</title>
<style>
.kanban-col { min-width: 200px; flex: 1; }
.kanban-card { font-size: .82rem; cursor: pointer; }
.kanban-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); transform: translateY(-1px); transition: .15s; }
</style>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h4 class="mb-0"><i class="fas fa-users-line me-2 text-indigo"></i>Pipeline Prospects</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" id="btnToggleView" onclick="toggleView()">
                <i class="fas fa-list me-1"></i>Vue liste
            </button>
            <a href="/intra/prospects/new" class="btn btn-sm btn-primary">
                <i class="fas fa-plus me-1"></i>Nouveau prospect
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show py-2">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ── Vue Kanban ─────────────────────────────────────────────────────── -->
    <div id="kanbanView" class="d-flex gap-3 overflow-auto pb-3">
        <div th:each="entry : ${prospectsByStatus}"
             class="kanban-col bg-light rounded p-2">
            <div class="d-flex align-items-center justify-content-between mb-2 px-1">
                <span class="badge small"
                      th:classappend="${entry.key.badgeCss}"
                      th:text="${entry.key.label}"></span>
                <span class="text-muted small" th:text="${#lists.size(entry.value)}"></span>
            </div>
            <div th:each="p : ${entry.value}" class="card kanban-card mb-2 border-0 shadow-sm">
                <div class="card-body p-2">
                    <a th:href="@{/intra/prospects/{id}(id=${p.id})}"
                       class="text-decoration-none text-dark">
                        <div class="fw-semibold text-truncate" th:text="${p.companyName}"></div>
                        <div class="text-muted" style="font-size:.75rem" th:text="${p.contactName}"></div>
                        <div th:if="${p.estimatedValue != null}" class="mt-1">
                            <span class="badge text-bg-light text-dark border">
                                <i class="fas fa-euro-sign me-1" style="font-size:.65rem"></i>
                                <span th:text="${#numbers.formatDecimal(p.estimatedValue, 1, 0)}"></span>
                            </span>
                        </div>
                        <div th:if="${p.assignedCommercialId != null}" class="text-muted mt-1" style="font-size:.72rem">
                            <i class="fas fa-user me-1"></i>
                            <span th:text="${commercialNames[p.assignedCommercialId] ?: '—'}"></span>
                        </div>
                    </a>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(entry.value)}"
                 class="text-center text-muted py-3" style="font-size:.8rem">—</div>
        </div>
    </div>

    <!-- ── Vue Liste ──────────────────────────────────────────────────────── -->
    <div id="listView" class="d-none">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(allProspects)}" class="text-center py-5 text-muted">
                    Aucun prospect.
                </div>
                <div class="table-responsive" th:unless="${#lists.isEmpty(allProspects)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3">Entreprise</th>
                            <th>Contact</th>
                            <th>Statut</th>
                            <th>Commercial</th>
                            <th class="text-end">Valeur est.</th>
                            <th>Clôture prev.</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${allProspects}">
                            <td class="ps-3 fw-semibold" th:text="${p.companyName}"></td>
                            <td class="text-muted small" th:text="${p.contactName}"></td>
                            <td>
                                <span class="badge" th:classappend="${p.prospectStatus?.badgeCss}"
                                      th:text="${p.prospectStatus?.label ?: '—'}"></span>
                            </td>
                            <td class="small text-muted"
                                th:text="${p.assignedCommercialId != null ? (commercialNames[p.assignedCommercialId] ?: '—') : '—'}"></td>
                            <td class="text-end small"
                                th:text="${p.estimatedValue != null ? #numbers.formatDecimal(p.estimatedValue, 1, 0) + ' €' : '—'}"></td>
                            <td class="small text-muted"
                                th:text="${p.expectedCloseDate != null ? #temporals.format(p.expectedCloseDate, 'dd/MM/yyyy') : '—'}"></td>
                            <td>
                                <a th:href="@{/intra/prospects/{id}(id=${p.id})}"
                                   class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
<th:block layout:fragment="script">
<script>
function toggleView() {
    const kanban = document.getElementById('kanbanView');
    const list   = document.getElementById('listView');
    const btn    = document.getElementById('btnToggleView');
    const isKanban = !kanban.classList.contains('d-none');
    kanban.classList.toggle('d-none', isKanban);
    list.classList.toggle('d-none', !isKanban);
    btn.innerHTML = isKanban
        ? '<i class="fas fa-columns me-1"></i>Vue Kanban'
        : '<i class="fas fa-list me-1"></i>Vue liste';
}
</script>
</th:block>
</html>
