<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Nouveau devis</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/intra/quotes" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h4 class="mb-0"><i class="fas fa-file-signature me-2 text-info"></i>Nouveau devis</h4>
    </div>

    <div class="card border-0 shadow-sm" style="max-width:700px">
        <div class="card-body">
            <form action="/intra/quotes" method="post">
                <input th:if="${opportunity != null}" type="hidden" name="opportunityId" th:value="${opportunity.id}">
                <div th:if="${opportunity != null}" class="alert alert-info py-2 mb-3 small">
                    <i class="fas fa-link me-1"></i>Ce devis sera automatiquement rattaché à l'affaire
                    <strong th:text="${opportunity.name}"></strong>.
                </div>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Client <span class="text-danger">*</span></label>
                        <select name="customerId" class="form-select" required>
                            <option value="">— Sélectionner —</option>
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:selected="${preCustomer != null and preCustomer.id == c.id}"
                                    th:text="${c.companyName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Date du devis</label>
                        <input type="date" name="quoteDate" class="form-control"
                               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Valide jusqu'au</label>
                        <input type="date" name="validUntil" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Notes</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Créer le devis
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
