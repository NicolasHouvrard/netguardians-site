<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Rôles</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0"><i class="fas fa-shield-alt me-2 text-primary"></i>Gestion des rôles</h4>
        <a href="/intra/users" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour utilisateurs
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Rôles ESN -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-bottom">
                    <span class="fw-semibold text-primary"><i class="fas fa-building me-2"></i>Rôles internes (ESN)</span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>Label</th><th>Identifiant</th><th class="text-end">Action</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="role : ${esnRoles != null ? esnRoles : T(java.util.Collections).emptyList()}">
                                <td><span class="badge text-bg-primary" th:text="${role.label}"></span></td>
                                <td><code th:text="${role.name}"></code></td>
                                <td class="text-end">
                                    <form th:action="@{/intra/roles/{id}/delete(id=${role.id})}" method="post"
                                          onsubmit="return confirm('Supprimer ce rôle ?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${esnRoles == null or esnRoles.isEmpty()}">
                                <td colspan="3" class="text-center text-muted py-3">Aucun rôle ESN.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Rôles CLIENT -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-bottom">
                    <span class="fw-semibold text-success"><i class="fas fa-user me-2"></i>Rôles portail (CLIENT)</span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>Label</th><th>Identifiant</th><th class="text-end">Action</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="role : ${clientRoles != null ? clientRoles : T(java.util.Collections).emptyList()}">
                                <td><span class="badge text-bg-success" th:text="${role.label}"></span></td>
                                <td><code th:text="${role.name}"></code></td>
                                <td class="text-end">
                                    <form th:action="@{/intra/roles/{id}/delete(id=${role.id})}" method="post"
                                          onsubmit="return confirm('Supprimer ce rôle ?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${clientRoles == null or clientRoles.isEmpty()}">
                                <td colspan="3" class="text-center text-muted py-3">Aucun rôle CLIENT.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Formulaire d'ajout -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-white border-bottom fw-semibold">
            <i class="fas fa-plus me-2"></i>Ajouter un rôle
        </div>
        <div class="card-body">
            <form action="/intra/roles" method="post" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Label affiché</label>
                    <input type="text" name="label" class="form-control" placeholder="ex: Développeur" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Identifiant technique</label>
                    <div class="input-group">
                        <span class="input-group-text text-muted small">ROLE_</span>
                        <input type="text" name="name" class="form-control" placeholder="DEVELOPPEUR" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select" required>
                        <option value="ESN">ESN (interne)</option>
                        <option value="CLIENT">CLIENT (portail)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-plus me-1"></i>Créer le rôle
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
