<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Publication</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/intra/social/posts" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h4 class="mb-0 flex-grow-1">
            <i class="fas fa-bullhorn me-2 text-primary"></i>
            <span th:text="${post.title}"></span>
        </h4>
        <span class="badge fs-6" th:classappend="${post.status.badgeCss}" th:text="${post.status.label}"></span>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Contenu + historique cibles -->
        <div class="col-lg-8">

            <!-- Contenu -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white fw-semibold">Contenu</div>
                <div class="card-body">
                    <p class="mb-0 text-break" style="white-space:pre-wrap" th:text="${post.content}"></p>
                </div>
                <div th:if="${post.imagePath != null}" class="card-footer bg-white">
                    <img th:src="@{/uploads/{p}(p=${post.imagePath})}"
                         class="img-fluid rounded" style="max-height:300px" alt="Image">
                </div>
            </div>

            <!-- Cibles -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">
                    <i class="fas fa-share-nodes me-2"></i>Réseaux ciblés
                </div>
                <div th:if="${targets == null or targets.isEmpty()}" class="card-body text-muted">
                    Aucun réseau sélectionné.
                </div>
                <table th:if="${targets != null and !targets.isEmpty()}"
                       class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Réseau</th>
                            <th>Statut</th>
                            <th>Publié le</th>
                            <th>ID externe</th>
                            <th>Tentatives</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${targets}">
                            <td>
                                <i th:class="${t.networkConfig.networkType.icon} + ' me-2'"></i>
                                <span th:text="${t.networkConfig.name}"></span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${t.status.badgeCss}"
                                      th:text="${t.status.label}"></span>
                            </td>
                            <td>
                                <span th:if="${t.publishedAt != null}"
                                      th:text="${#temporals.format(t.publishedAt, 'dd/MM/yyyy HH:mm')}"></span>
                                <span th:unless="${t.publishedAt != null}" class="text-muted">—</span>
                            </td>
                            <td>
                                <code th:if="${t.externalPostId != null}" th:text="${t.externalPostId}"></code>
                                <span th:unless="${t.externalPostId != null}" class="text-muted">—</span>
                            </td>
                            <td th:text="${t.attempts}">0</td>
                        </tr>
                        <!-- Ligne erreur si présente -->
                        <tr th:each="t : ${targets}" th:if="${t.error != null}">
                            <td colspan="5" class="py-1">
                                <small class="text-danger"><i class="fas fa-circle-exclamation me-1"></i>
                                    <span th:text="${t.networkConfig.name}"></span> :
                                    <span th:text="${t.error}"></span>
                                </small>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

        <!-- Colonne latérale -->
        <div class="col-lg-4">

            <!-- Infos -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white fw-semibold">Informations</div>
                <div class="card-body small">
                    <dl class="row mb-0">
                        <dt class="col-6 text-muted">Créé le</dt>
                        <dd class="col-6" th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}"></dd>

                        <dt class="col-6 text-muted">Planifié le</dt>
                        <dd class="col-6">
                            <span th:if="${post.scheduledAt != null}"
                                  th:text="${#temporals.format(post.scheduledAt, 'dd/MM/yyyy HH:mm')}"></span>
                            <span th:unless="${post.scheduledAt != null}" class="text-muted">—</span>
                        </dd>

                        <dt class="col-6 text-muted">Publié le</dt>
                        <dd class="col-6">
                            <span th:if="${post.publishedAt != null}"
                                  th:text="${#temporals.format(post.publishedAt, 'dd/MM/yyyy HH:mm')}"></span>
                            <span th:unless="${post.publishedAt != null}" class="text-muted">—</span>
                        </dd>
                    </dl>
                </div>
            </div>

            <!-- Actions -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">Actions</div>
                <div class="card-body d-grid gap-2">

                    <!-- Publier maintenant (DRAFT, SCHEDULED, FAILED) -->
                    <form th:if="${post.status.name() == 'DRAFT' or post.status.name() == 'SCHEDULED' or post.status.name() == 'FAILED'}"
                          th:action="@{/intra/social/posts/{id}/publish(id=${post.id})}"
                          method="post">
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-paper-plane me-1"></i>Publier maintenant
                        </button>
                    </form>

                    <!-- Annuler planification (SCHEDULED) -->
                    <form th:if="${post.status.name() == 'SCHEDULED'}"
                          th:action="@{/intra/social/posts/{id}/cancel(id=${post.id})}"
                          method="post">
                        <button type="submit" class="btn btn-outline-warning w-100">
                            <i class="fas fa-clock-rotate-left me-1"></i>Remettre en brouillon
                        </button>
                    </form>

                    <!-- Supprimer (DRAFT seulement) -->
                    <form th:if="${post.status.name() == 'DRAFT'}"
                          th:action="@{/intra/social/posts/{id}/delete(id=${post.id})}"
                          method="post"
                          onsubmit="return confirm('Supprimer ce brouillon ?')">
                        <button type="submit" class="btn btn-outline-danger w-100">
                            <i class="fas fa-trash me-1"></i>Supprimer
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
