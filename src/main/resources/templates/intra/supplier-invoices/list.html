<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Factures fournisseurs</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-2">
            <a href="/intra/accounting" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Comptabilité
            </a>
            <div>
                <h4 class="mb-0"><i class="fas fa-file-import me-2 text-warning"></i>Factures fournisseurs</h4>
                <div class="text-muted small mt-1">Gestion des factures reçues</div>
            </div>
        </div>
        <a href="/intra/supplier-invoices/upload" class="btn btn-warning">
            <i class="fas fa-upload me-1"></i>Importer une facture
        </a>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
                        <i class="fas fa-pen text-secondary fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${countDraft}">0</div>
                        <div class="text-muted small">À valider</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-warning bg-opacity-10 p-3">
                        <i class="fas fa-clock text-warning fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${countToPay}">0</div>
                        <div class="text-muted small">À payer</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-success bg-opacity-10 p-3">
                        <i class="fas fa-check text-success fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${countPaid}">0</div>
                        <div class="text-muted small">Payées</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-info bg-opacity-10 p-3">
                        <i class="fas fa-brain text-info fa-lg"></i>
                    </div>
                    <div>
                        <div class="fs-5 fw-bold">
                            <span th:if="${mindeeReady}"   class="badge text-bg-info me-1">Mindee</span>
                            <span th:if="${googleAiReady}" class="badge text-bg-primary me-1">Google</span>
                            <span th:unless="${mindeeReady or googleAiReady}" class="text-muted">—</span>
                        </div>
                        <div class="text-muted small">OCR disponible</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3 pb-2">
            <h6 class="fw-bold mb-0"><i class="fas fa-list me-2 text-warning"></i>Factures reçues</h6>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(invoices)}" class="text-center py-5 text-muted">
                <i class="fas fa-file-import fa-2x mb-3 d-block opacity-25"></i>
                Aucune facture fournisseur.
                <div class="mt-2">
                    <a href="/intra/supplier-invoices/upload" class="btn btn-sm btn-warning mt-1">
                        <i class="fas fa-upload me-1"></i>Importer une facture
                    </a>
                </div>
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(invoices)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>N° facture</th>
                        <th>Fournisseur</th>
                        <th>Date</th>
                        <th>Échéance</th>
                        <th class="text-end">Total HT</th>
                        <th class="text-end">TVA</th>
                        <th class="text-end">Total TTC</th>
                        <th>Statut</th>
                        <th>Compte charge</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${invoices}">
                        <td>
                            <a th:href="@{/intra/supplier-invoices/{id}(id=${inv.id})}"
                               class="fw-semibold text-decoration-none"
                               th:text="${inv.invoiceNumber != null ? inv.invoiceNumber : '#' + inv.id}"></a>
                        </td>
                        <td th:text="${inv.vendorName != null ? inv.vendorName : '—'}"></td>
                        <td th:text="${inv.invoiceDate != null ? #temporals.format(inv.invoiceDate, 'dd/MM/yyyy') : '—'}"></td>
                        <td>
                            <span th:if="${inv.dueDate != null}"
                                  th:classappend="${inv.status != null and inv.status.name() == 'TO_PAY' and inv.dueDate.isBefore(T(java.time.LocalDate).now())} ? 'text-danger fw-semibold' : ''"
                                  th:text="${#temporals.format(inv.dueDate, 'dd/MM/yyyy')}"></span>
                            <span th:unless="${inv.dueDate != null}" class="text-muted">—</span>
                        </td>
                        <td class="text-end" th:text="${inv.totalHT != null ? #numbers.formatDecimal(inv.totalHT, 1, 'COMMA', 2, 'POINT') + ' €' : '—'}"></td>
                        <td class="text-end" th:text="${inv.totalTVA != null ? #numbers.formatDecimal(inv.totalTVA, 1, 'COMMA', 2, 'POINT') + ' €' : '—'}"></td>
                        <td class="text-end fw-semibold" th:text="${inv.totalTTC != null ? #numbers.formatDecimal(inv.totalTTC, 1, 'COMMA', 2, 'POINT') + ' €' : '—'}"></td>
                        <td>
                            <span class="badge" th:if="${inv.status != null}"
                                  th:classappend="${inv.status.badgeCss}"
                                  th:text="${inv.status.label}"></span>
                        </td>
                        <td class="font-monospace small text-muted"
                            th:text="${inv.chargeAccountNumber != null ? inv.chargeAccountNumber : '—'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
