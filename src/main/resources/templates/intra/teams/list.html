<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{intra-layout}">
<head><title>Équipes</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0"><i class="fas fa-people-group me-2 text-primary"></i>Équipes</h4>
        <a href="/intra/teams/new" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nouvelle équipe
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${teams == null or teams.isEmpty()}" class="text-center py-5 text-muted">
                <i class="fas fa-people-group fa-2x mb-3 d-block"></i>
                Aucune équipe créée.
            </div>
            <div class="table-responsive" th:if="${teams != null and !teams.isEmpty()}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Équipe</th>
                            <th>Membres</th>
                            <th>Types de demande pris en charge</th>
                            <th class="text-end pe-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="team : ${teams}">
                            <td class="ps-3">
                                <div class="fw-semibold" th:text="${team.name}"></div>
                                <div th:if="${team.description != null}" class="small text-muted" th:text="${team.description}"></div>
                            </td>
                            <td>
                                <div th:if="${team.members.isEmpty()}" class="small text-muted fst-italic">Aucun membre</div>
                                <div th:if="${!team.members.isEmpty()}" class="d-flex flex-wrap gap-1">
                                    <span th:each="u : ${team.members}" class="badge text-bg-light border small fw-normal"
                                          th:text="${u.fullName}"></span>
                                </div>
                            </td>
                            <td>
                                <div th:if="${team.requestTypes.isEmpty()}" class="small text-muted fst-italic">Tous types</div>
                                <div th:if="${!team.requestTypes.isEmpty()}" class="d-flex flex-wrap gap-1">
                                    <span th:each="rt : ${team.requestTypes}" class="badge text-bg-secondary small fw-normal"
                                          th:text="${rt.label}"></span>
                                </div>
                            </td>
                            <td class="text-end pe-3">
                                <div class="d-flex gap-1 justify-content-end">
                                    <a th:href="@{/intra/teams/{id}/edit(id=${team.id})}"
                                       class="btn btn-sm btn-outline-secondary" title="Modifier">
                                        <i class="fas fa-pencil-alt"></i>
                                    </a>
                                    <form th:action="@{/intra/teams/{id}/delete(id=${team.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Supprimer cette équipe ?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
