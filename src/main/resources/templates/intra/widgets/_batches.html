<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="widget" class="d-flex flex-column h-100">
    <div class="widget-list-header">
        <span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0"
              th:style="'background:' + ${widget.color} + '22;width:26px;height:26px'">
            <i th:class="${widget.icon}" th:style="'color:' + ${widget.color} + ';font-size:.7rem'"></i>
        </span>
        <span class="fw-semibold small flex-grow-1 text-truncate" th:text="${widget.label}"></span>
        <a th:href="${widget.link}" class="btn btn-xs btn-outline-secondary py-0 px-2"
           style="font-size:.7rem;white-space:nowrap">Voir tout →</a>
        <form th:if="${dashboard != null}"
              th:action="@{/intra/dashboard/{s}/widget/remove(s=${dashboard})}" method="post" class="ms-1">
            <input type="hidden" name="widgetType" th:value="${widgetKey}">
            <button type="submit" class="btn btn-xs btn-outline-danger py-0 px-1 btn-widget-remove" title="Retirer"
                    onclick="return confirm('Retirer ce widget ?')">
                <i class="fas fa-times" style="font-size:.65rem"></i>
            </button>
        </form>
    </div>

    <!-- Résumé compteurs -->
    <div class="px-3 py-2 d-flex gap-2 border-bottom">
        <span class="badge text-bg-warning text-dark"
              th:text="${draftCount} + ' brouillon' + (${draftCount} > 1 ? 's' : '')"></span>
        <span class="badge text-bg-success"
              th:text="${postedCount} + ' validé' + (${postedCount} > 1 ? 's' : '')"></span>
    </div>

    <!-- Liste des lots récents -->
    <div class="widget-list-scroll">
        <div th:each="row : ${rows}" class="d-flex align-items-center gap-2 px-3 py-2 border-bottom">
            <div class="flex-grow-1 min-w-0">
                <div class="fw-semibold small text-truncate" th:text="${row.name}"></div>
                <div class="text-muted font-monospace" style="font-size:.68rem"
                     th:text="${#temporals.format(row.batchDate, 'dd/MM/yyyy')}"></div>
            </div>
            <span class="badge text-bg-light text-muted small"
                  th:text="${row.entryCount} + ' écriture' + (${row.entryCount} > 1 ? 's' : '')"></span>
            <span class="badge small"
                  th:classappend="${row.status == 'DRAFT'} ? 'text-bg-warning text-dark' : 'text-bg-success'"
                  th:text="${row.status == 'DRAFT'} ? 'Brouillon' : 'Validé'"></span>
            <a th:href="@{/intra/accounting/batches/{id}(id=${row.id})}"
               class="btn btn-xs btn-outline-secondary py-0 px-2" style="font-size:.7rem">→</a>
        </div>
        <div th:if="${rows == null or #lists.isEmpty(rows)}" class="text-center text-muted py-3 small">
            Aucun lot OD
        </div>
    </div>
</div>
</body>
</html>
