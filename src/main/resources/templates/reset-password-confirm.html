<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Nouveau mot de passe</title>
</head>
<body>
<section layout:fragment="content">
<div class="row justify-content-center align-items-center" style="min-height:80vh">
    <div class="col-md-5">
        <div class="card shadow border-0 p-4">

            <!-- Lien invalide ou expiré -->
            <div th:if="${error != null and token == null}" class="text-center">
                <div style="font-size:3rem" class="mb-3">⛔</div>
                <h3 class="fw-bold text-danger mb-2">Lien invalide</h3>
                <p class="text-muted" th:text="${error}"></p>
                <a href="/reset-password" class="btn btn-primary mt-3">Faire une nouvelle demande</a>
            </div>

            <!-- Formulaire nouveau mot de passe -->
            <div th:if="${token != null}">
                <h2 class="text-center mb-2">Nouveau mot de passe</h2>
                <p class="text-center text-muted mb-4">Choisissez un mot de passe sécurisé d'au moins 8 caractères.</p>

                <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/reset-password/confirm}" method="post">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label class="form-label">Nouveau mot de passe</label>
                        <input type="password" name="password" class="form-control" required
                               minlength="8" autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirmer le mot de passe</label>
                        <input type="password" name="passwordConfirm" class="form-control" required
                               minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Enregistrer le nouveau mot de passe
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
</section>
</body>
</html>
