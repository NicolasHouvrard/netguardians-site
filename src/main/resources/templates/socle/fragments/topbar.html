<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="socle-topbar">
    <div class="dropdown socle-apps">
        <button type="button" class="socle-topbar-btn" data-bs-toggle="dropdown" aria-expanded="false"
                aria-label="Applications" title="Applications">
            <i class="bi bi-grid-3x3-gap-fill"></i>
        </button>
        <div class="dropdown-menu socle-apps-menu">
            <div class="socle-apps-grid">
                <a th:each="t : ${tuiles != null ? tuiles : (apps != null ? apps.tuiles() : {})}"
                   class="socle-tuile" th:href="@{${t.chemin()}}">
                    <i class="bi" th:classappend="${t.icone() != null ? t.icone() : 'bi-app'}"></i>
                    <span th:text="${t.libelle()}">Application</span>
                </a>
            </div>
        </div>
    </div>
    <a class="socle-marque" href="/" th:text="${moduleActif != null ? moduleActif : 'Accueil'}">Accueil</a>
    <nav class="socle-menu-module" th:if="${menuModule != null}">
        <a th:each="m : ${menuModule}" th:href="@{${m.chemin()}}" th:text="${m.libelle()}">Lien</a>
    </nav>
    <div class="socle-topbar-fin"></div>
</header>
</body>
</html>
