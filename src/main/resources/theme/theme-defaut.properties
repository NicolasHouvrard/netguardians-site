# Valeurs par defaut du theme (toutes les cles sont obligatoires ; valeurs validees au demarrage).
# Une valeur "ref:<cle>" herite de la valeur effective de l'autre cle (rendue var(--socle-<cle>)).
# Contraste (WCAG AA >= 4.5:1) : texte blanc sur couleur-primaire 6.6, app-* de 5.0 a 7.6, fiche-statut-actif-fond 5.0 ;
# couleur-texte sur couleur-fond / tuile-fond / liste-entete-fond : 13.5 / 14.7 / 12.4.

# General
couleur-primaire=#6d4c9f
couleur-secondaire=#475569
couleur-fond=#f4f5f7
couleur-texte=#1f2937
couleur-bordure=#d9dde3
police=systeme
taille-texte=15
epaisseur-trait=1
arrondi=8

# Barre superieure
topbar-fond=ref:couleur-primaire
topbar-texte=#ffffff
topbar-hauteur=46

# Tuiles
tuile-fond=#ffffff
tuile-arrondi=12
tuile-taille-icone=40
app-primaire=#1d4ed8
app-violet=#7c3aed
app-sarcelle=#0f766e
app-orange=#c2410c
app-ambre=#b45309
app-rose=#be185d
app-ardoise=#475569
app-vert=#15803d

# Liste
liste-densite=normal
liste-lignes-alternees=oui
liste-entete-fond=#e9ecf1

# Fiche
fiche-statut-style=chevron
fiche-statut-actif-fond=#15803d

# Boutons
bouton-arrondi=8
bouton-primaire-fond=ref:couleur-primaire
